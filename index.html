    function useNow() {
      const [now, setNow] = useState(() => new Date());
      useEffect(() => {
        const t = setInterval(() => setNow(new Date()), 30000);
        return () => clearInterval(t);
      }, []);
      return now;
    }

    function computeStatus(ph, now) {
      if (ph.onDuty) return { open: true, kind: "onDuty" };
      const hour = now.getHours() + now.getMinutes() / 60;
      const { open, close } = ph.hours || { open: 8, close: 21 };
      const isOpen = close > 24 ? (hour >= open || hour < close - 24) : (hour >= open && hour < close);
      return { open: isOpen, kind: isOpen ? "closesAt" : "opensAt", time: isOpen ? close % 24 : open };
    }

    function fmtHour(h) {
      const hh = Math.floor(h) % 24;
      const mm = Math.round((h - Math.floor(h)) * 60);
      return String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0");
    }

    function haversine(lat1, lng1, lat2, lng2) {
      const R = 6371;
      const dLat = ((lat2 - lat1) * Math.PI) / 180;
      const dLng = ((lng2 - lng1) * Math.PI) / 180;
      const a = Math.sin(dLat / 2) ** 2 + Math.cos((lat1 * Math.PI) / 180) * Math.cos((lat2 * Math.PI) / 180) * Math.sin(dLng / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function sanitize(text, max = 100) {
      if (!text || typeof text !== "string") return null;
      const cleaned = text.trim().replace(/[<>\x00-\x1F\x7F]/g, "").substring(0, max);
      return cleaned.length > 0 ? cleaned : null;
    }

    function isValidPhone(phone) {
      if (!phone) return true;
      return /^[+\d\s\-()]{6,20}$/.test(phone.trim());
    }

    async function searchCities(query, countryCode) {
      if (!query.trim()) return [];
      const cc = countryCode === "OTHER" ? "" : countryCode;
      const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query + (cc ? ", " + cc : ""))}&format=json&addressdetails=1&limit=8&accept-language=ar,en,fr`;
      const res = await fetch(url, { headers: { "Accept-Language": "ar,en,fr" } });
      const data = await res.json();
      return data
        .filter(item => ["city", "town", "village", "municipality"].includes(item.type) || item.class === "place")
        .map(item => ({
          name: item.display_name.split(",")[0],
          fullName: item.display_name,
          lat: parseFloat(item.lat),
          lng: parseFloat(item.lon),
          country: item.address?.country || ""
        }));
    }

    async function geocodeAddress(address, countryHint) {
      const q = countryHint ? `${address}, ${countryHint}` : address;
      const res = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1&addressdetails=1`);
      const data = await res.json();
      if (!data.length) throw new Error("Address not found");
      return {
        lat: parseFloat(data[0].lat),
        lng: parseFloat(data[0].lon),
        displayName: data[0].display_name,
        city: data[0].address?.city || data[0].address?.town || data[0].address?.village || "",
        countryCode: (data[0].address?.country_code || "").toUpperCase()
      };
    }

    async function fetchOSMPharmacies(lat, lng, radius = 6000) {
      const query = `[out:json][timeout:20];(node["amenity"="pharmacy"](around:${radius},${lat},${lng}););out body;`;
      const res = await fetch("https://overpass-api.de/api/interpreter?data=" + encodeURIComponent(query));
      if (!res.ok) throw new Error("Overpass failed");
      const data = await res.json();
      return (data.elements || []).map((el, idx) => {
        const t = el.tags || {};
        const name = t["name:ar"] || t.name || "صيدلية";
        const address = [t["addr:street"], t["addr:housenumber"], t["addr:city"]].filter(Boolean).join(", ");
        const phone = t.phone || t["contact:phone"] || null;
        const onDuty = t.opening_hours && t.opening_hours.includes("24/7");
        return {
          id: `osm_${el.id}_${idx}`,
          name: /صيدلية|Pharmacie|Pharmacy/i.test(name) ? name : `صيدلية ${name}`,
          area: t["addr:suburb"] || t["addr:city"] || "",
          address: address || "",
          phone,
          lat: el.lat,
          lng: el.lon,
          hours: { open: onDuty ? 0 : 8, close: onDuty ? 24 : 21 },
          onDuty: !!onDuty,
          wilaya: "OSM",
          commune: t["addr:city"] || "",
          verified: true,
          fromOSM: true
        };
      }).filter(p => p.lat && p.lng);
    }

    async function fetchOSMByCity(cityName) {
      const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(cityName)}&format=json&limit=1`);
      const geoData = await geoRes.json();
      if (!geoData.length) throw new Error("City not found");
      const [s, n, w, e] = geoData[0].boundingbox.map(Number);
      const query = `[out:json][timeout:25];(node["amenity"="pharmacy"](${s},${w},${n},${e}););out body;`;
      const res = await fetch("https://overpass-api.de/api/interpreter?data=" + encodeURIComponent(query));
      if (!res.ok) throw new Error("Overpass failed");
      const data = await res.json();
      const city = geoData[0].display_name.split(",")[0];
      return (data.elements || []).map((el, idx) => {
        const t = el.tags || {};
        const name = t["name:ar"] || t.name || "صيدلية";
        const onDuty = t.opening_hours && t.opening_hours.includes("24/7");
        return {
          id: `osm_${el.id}_${idx}`,
          name: /صيدلية|Pharmacie|Pharmacy/i.test(name) ? name : `صيدلية ${name}`,
          area: t["addr:suburb"] || t["addr:city"] || city,
          address: [t["addr:street"], t["addr:housenumber"]].filter(Boolean).join(", ") || "",
          phone: t.phone || t["contact:phone"] || null,
          lat: el.lat,
          lng: el.lon,
          hours: { open: onDuty ? 0 : 8, close: onDuty ? 24 : 21 },
          onDuty: !!onDuty,
          wilaya: city,
          commune: t["addr:city"] || city,
          verified: true,
          fromOSM: true
        };
      }).filter(p => p.lat && p.lng);
    }

                <p className="text-xs text-stone-500 dark:text-brand-300 mt-0.5 truncate">{ph.area}{ph.address ? ` · ${ph.address}` : ""}</p>
                <div className="flex items-center justify-between mt-1.5">
                  <p className={`text-xs font-medium ${ph.status.open ? "text-emerald-600 dark:text-emerald-400" : "text-rose-500"}`}>
                    {ph.status.open ? t("openNow") : t("closedNow")}
                    {ph.status.kind !== "onDuty" && ` · ${t(ph.status.kind, { time: fmtHour(ph.status.time) })}`}
                    {ph.status.kind === "onDuty" && ` · ${t("onDutyLabel")}`}
                  </p>
                  {ph.avgRating !== null && (
                    <span className="flex items-center gap-0.5 text-xs text-amber-500">
                      <Icons.Star className="w-3 h-3" fill="currentColor" />
                      {ph.avgRating.toFixed(1)}
                    </span>
                  )}
                </div>
              </div>
            </button>
            <div className="flex flex-col items-center gap-0.5 flex-shrink-0">
              <button onClick={() => onToggleFav(ph.id, ph.name)} className={`p-2 rounded-full transition ${ph.isFavorite ? "text-rose-500" : "text-stone-300 dark:text-brand-600 hover:text-rose-400"}`}>
                <Icons.Heart className="w-4 h-4" fill={ph.isFavorite ? "currentColor" : "none"} />
              </button>
              <button onClick={() => onReport(ph.id, ph.name)} className="p-2 rounded-full text-stone-300 dark:text-brand-600 hover:text-rose-400 transition">
                <Icons.Flag className="w-4 h-4" />
              </button>
            </div>
          </div>
        </div>
      );
    });

    function MapView({ pharmacies, userLoc, lang, onSelect }) {
      const mapRef = useRef(null);
      const mapInstance = useRef(null);

      useEffect(() => {
        if (!mapRef.current || mapInstance.current) return;
        const map = L.map(mapRef.current, { zoomControl: false }).setView([userLoc.lat, userLoc.lng], 13);
        L.control.zoom({ position: "bottomright" }).addTo(map);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          attribution: "© OpenStreetMap"
        }).addTo(map);

        L.circleMarker([userLoc.lat, userLoc.lng], {
          radius: 9, fillColor: "#3b82f6", color: "#fff", weight: 2.5, fillOpacity: 0.95
        }).addTo(map).bindPopup(lang === "ar" ? "📍 أنت هنا" : lang === "fr" ? "📍 Vous êtes ici" : "📍 You are here");

        const markers = [];
        pharmacies.forEach(ph => {
          const color = ph.status.open ? "#059669" : "#dc2626";
          const m = L.circleMarker([ph.lat, ph.lng], {
            radius: 11, fillColor: color, color: "#fff", weight: 2, fillOpacity: 0.9
          }).addTo(map);
          m.bindPopup(`<div style="font-family:sans-serif;text-align:${lang==="ar"?"right":"left"};direction:${lang==="ar"?"rtl":"ltr"};min-width:180px;padding:2px">
            <b style="color:#064e3b">${ph.name}</b><br/>
            <span style="font-size:12px;color:#666">${ph.area}</span><br/>
            <span style="font-size:12px;font-weight:600;color:${ph.status.open?"#059669":"#dc2626"}">${ph.status.open ? "🟢 Open" : "🔴 Closed"}</span>
          </div>`);
          m.on("click", () => onSelect && onSelect(ph));
          markers.push(m);
        });

        if (markers.length) {
          const group = L.featureGroup(markers);
          map.fitBounds(group.getBounds().pad(0.12));
        }
        mapInstance.current = map;
        return () => {
          map.remove();
          mapInstance.current = null;
        };
      }, []);

      return <div ref={mapRef} className="w-full h-full min-h-[50vh] rounded-2xl" />;
    }

    // ═══════════════════════════════════════════════════════════
    // MAIN APP
    // ═══════════════════════════════════════════════════════════
    function PharisApp() {
      const now = useNow();
      const [lang, setLang] = useState(() => {
        const b = (navigator.language || "ar").slice(0, 2);
        return ["ar", "fr", "en"].includes(b) ? b : "ar";
      });
      const [dark, setDark] = useState(() => window.matchMedia("(prefers-color-scheme: dark)").matches);
      const [query, setQuery] = useState("");
      const [filter, setFilter] = useState("all");
      const [selected, setSelected] = useState(null);
      const [toast, setToast] = useState(null);
      const [showMap, setShowMap] = useState(false);
      const [showLocationPicker, setShowLocationPicker] = useState(false);
      const [showAddForm, setShowAddForm] = useState(false);
      const [showLogin, setShowLogin] = useState(false);
      const [adminView, setAdminView] = useState(false);
      const [adminTab, setAdminTab] = useState("review");

      // Location & data
      const [countryId, setCountryId] = useState("DZ");
      const [wilayaId, setWilayaId] = useState(22);
      const [userLoc, setUserLoc] = useState(DEFAULT_LOC);
      const [locating, setLocating] = useState(true);
      const [geoError, setGeoError] = useState(null);
      const [osmPharmacies, setOsmPharmacies] = useState([]);
      const [loadingOSM, setLoadingOSM] = useState(false);
      const [submitted, setSubmitted] = useState([]);
      const [removedIds, setRemovedIds] = useState(new Set());
      const [complaints, setComplaints] = useState({});
      const [reportedByMe, setReportedByMe] = useState(new Set());
      const [favorites, setFavorites] = useState(new Set());
      const [ratings, setRatings] = useState({});
      const [myReviews, setMyReviews] = useState({});
      const [draftStars, setDraftStars] = useState(0);
      const [draftText, setDraftText] = useState("");

      // City search
      const [citySearch, setCitySearch] = useState("");
      const [cityResults, setCityResults] = useState([]);
      const [loadingCities, setLoadingCities] = useState(false);
      const [currentPlace, setCurrentPlace] = useState("سيدي بلعباس");

      // Admin
      const [adminUser, setAdminUser] = useState(null);
      const [loginEmail, setLoginEmail] = useState("");
      const [loginPassword, setLoginPassword] = useState("");
      const [loginError, setLoginError] = useState(null);
      const [loginLoading, setLoginLoading] = useState(false);

      // Add form
      const [form, setForm] = useState({ name: "", area: "", address: "", phone: "", open: 8, close: 21, onDuty: false, country: "DZ", city: "" });
      const [formLoc, setFormLoc] = useState(null);
      const [formLocStatus, setFormLocStatus] = useState(null);
      const [submitting, setSubmitting] = useState(false);
      const [lastSubmit, setLastSubmit] = useState(0);

      const t = useCallback((key, vars) => tr(lang, key, vars), [lang]);
      const dir = lang === "ar" ? "rtl" : "ltr";

      // Dark mode
      useEffect(() => {
        document.documentElement.classList.toggle("dark", dark);
      }, [dark]);

      // Geolocation
      useEffect(() => {
        if (!navigator.geolocation) {
          setLocating(false);
          setGeoError("unsupported");
          return;
        }
        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            setUserLoc({ lat, lng });
            try {
              const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&accept-language=${lang}`);
              const data = await res.json();
              const addr = data.address || {};
              const state = addr.state || addr.city || "";
              const match = WILAYAS.find(w => w.enabled && w.id !== 999 && (state.includes(w.name) || w.name.includes(state)));
              if (match) {
                setWilayaId(match.id);
                setCurrentPlace(match.name);
              }
            } catch {}
            setLocating(false);
          },
          () => { setGeoError("denied"); setLocating(false); },
          { timeout: 12000, enableHighAccuracy: true }
        );
      }, []);

      // Auth
      useEffect(() => {
        const unsub = auth.onAuthStateChanged(u => setAdminUser(u));
        return unsub;
      }, []);

      // Load submitted + removed
      useEffect(() => {
        if (!db) return;
        const place = WILAYAS.find(w => w.id === wilayaId)?.name;
        if (place && place !== "🌍 OpenStreetMap") {
          db.collection("pharmacies_submitted").where("wilaya", "==", place).get()
            .then(snap => setSubmitted(snap.docs.map(d => ({ id: d.id, ...d.data() }))))
            .catch(() => {});
        }
        db.collection("removed_pharmacies").get()
          .then(snap => setRemovedIds(new Set(snap.docs.map(d => isNaN(d.id) ? d.id : Number(d.id)))))
          .catch(() => {});
      }, [wilayaId]);

      // Sync selected review draft
      useEffect(() => {
        if (selected) {
          const mine = myReviews[selected.id];
          setDraftStars(mine?.stars || 0);
          setDraftText(mine?.text || "");
        }
      }, [selected?.id]);

      // Computed list
      const baseList = useMemo(() => {
        const local = RAW.filter(p => {
          if (wilayaId === 999) return false;
          const w = WILAYAS.find(x => x.id === wilayaId);
          return w && p.wilaya === w.name;
        });
        const submittedMapped = submitted.map(p => ({
          ...p,
          verified: false,
          hours: p.hours || { open: 8, close: 21 },
          complaints: 0,
          ratingSum: 0,
          ratingCount: 0
        }));
        return [...local, ...submittedMapped, ...osmPharmacies];
      }, [wilayaId, submitted, osmPharmacies]);

      const allComputed = useMemo(() => {
        return baseList
          .filter(ph => !removedIds.has(ph.id))
          .map(ph => {
            const status = computeStatus(ph, now);
            const distance = haversine(userLoc.lat, userLoc.lng, ph.lat, ph.lng);
            const complaintCount = complaints[ph.id] || 0;
            const r = ratings[ph.id] || { sum: ph.ratingSum || 0, count: ph.ratingCount || 0 };
            return {
              ...ph,
              status,
              distance,
              complaintCount,
              underReview: complaintCount >= COMPLAINT_THRESHOLD,
              avgRating: r.count > 0 ? r.sum / r.count : null,
              ratingCount: r.count,
              isFavorite: favorites.has(ph.id)
            };
          });
      }, [baseList, now, complaints, removedIds, ratings, favorites, userLoc]);

      const list = useMemo(() => {
        return allComputed
          .filter(ph => (ph.name + " " + (ph.area || "") + " " + (ph.address || "")).toLowerCase().includes(query.toLowerCase()))
          .filter(ph => filter === "open" ? ph.status.open : true)
          .filter(ph => filter === "urgent" ? ph.onDuty : true)
          .filter(ph => filter === "favorites" ? ph.isFavorite : true)
          .filter(ph => filter === "late" ? (ph.status.open && (ph.hours?.close > 22 || ph.onDuty)) : true)
          .sort((a, b) => a.distance - b.distance);
      }, [allComputed, query, filter]);

      const openCount = list.filter(p => p.status.open).length;
      const reviewQueue = useMemo(() => {
        return RAW
          .filter(ph => !removedIds.has(ph.id))
          .map(ph => ({ ...ph, complaintCount: complaints[ph.id] || 0 }))
          .filter(ph => ph.complaintCount >= COMPLAINT_THRESHOLD)
          .sort((a, b) => b.complaintCount - a.complaintCount);
      }, [complaints, removedIds]);

      const selectedLive = selected ? allComputed.find(p => p.id === selected.id) || selected : null;
      const timeStr = now.toLocaleTimeString(lang === "ar" ? "ar-DZ" : lang === "fr" ? "fr-FR" : "en-GB", { hour: "2-digit", minute: "2-digit" });

      // Actions
      const showToast = (msg) => setToast(msg);

      const toggleFavorite = (id, name) => {
        setFavorites(prev => {
          const next = new Set(prev);
          if (next.has(id)) {
            next.delete(id);
            showToast(t("removedFavorite", { name }));
          } else {
            next.add(id);
            showToast(t("addedFavorite", { name }));
          }
          return next;
        });
      };

      const reportPharmacy = (id, name) => {
        if (reportedByMe.has(id)) {
          showToast(t("alreadyReported"));
          return;
        }
        setComplaints(prev => {
          const next = { ...prev, [id]: (prev[id] || 0) + 1 };
          showToast(next[id] === COMPLAINT_THRESHOLD ? t("thresholdReached", { n: COMPLAINT_THRESHOLD, name }) : t("thanksReport"));
          return next;
        });
        setReportedByMe(prev => new Set(prev).add(id));
      };

      const submitRating = (id) => {
        if (draftStars === 0) {
          showToast(t("pickStarsFirst"));
          return;
        }
        setRatings(prev => {
          const cur = prev[id] || { sum: 0, count: 0 };
          const already = myReviews[id];
          const sum = already ? cur.sum - already.stars + draftStars : cur.sum + draftStars;
          const count = already ? cur.count : cur.count + 1;
          return { ...prev, [id]: { sum, count } };
        });
        setMyReviews(prev => ({ ...prev, [id]: { stars: draftStars, text: draftText } }));
        showToast(t("reviewSubmitted"));
      };

      const loadOSMNearMe = async () => {
        setLoadingOSM(true);
        try {
          const data = await fetchOSMPharmacies(userLoc.lat, userLoc.lng);
          setOsmPharmacies(data);
          setWilayaId(999);
          setCurrentPlace("Nearby (OSM)");
          showToast(t("pharmaciesFound", { n: data.length, name: "nearby" }));
        } catch {
          showToast(t("loadFailed"));
        } finally {
          setLoadingOSM(false);
        }
      };

      const searchCityAndLoad = async () => {
        if (!citySearch.trim()) return;
        setLoadingCities(true);
        try {
          const results = await searchCities(citySearch, countryId);
          setCityResults(results);
        } catch {
          setCityResults([]);
        } finally {
          setLoadingCities(false);
        }
      };

      const selectCity = async (city) => {
        setCityResults([]);
        setCitySearch(city.name);
        setUserLoc({ lat: city.lat, lng: city.lng });
        setCurrentPlace(city.name);
        setLoadingOSM(true);
        try {
          const data = await fetchOSMByCity(city.name + (city.country ? ", " + city.country : ""));
          setOsmPharmacies(data);
          setWilayaId(999);
          showToast(t("pharmaciesFound", { n: data.length, name: city.name }));
        } catch {
          showToast(t("loadFailed"));
        } finally {
          setLoadingOSM(false);
          setShowLocationPicker(false);
        }
      };

      const selectWilaya = (w) => {
        if (!w.enabled) return;
        setWilayaId(w.id);
        setOsmPharmacies([]);
        setCurrentPlace(w.name);
        setShowLocationPicker(false);
      };

      // Add pharmacy
      const captureFormLocation = () => {
        if (!navigator.geolocation) {
          setFormLocStatus("failed");
          return;
        }
        setFormLocStatus("loading");
        navigator.geolocation.getCurrentPosition(
          pos => {
            setFormLoc({ lat: pos.coords.latitude, lng: pos.coords.longitude });
            setFormLocStatus("ok");
          },
          () => setFormLocStatus("failed"),
          { timeout: 8000 }
        );
      };

      const submitNewPharmacy = async () => {
        const vName = sanitize(form.name, 80);
        const vAddress = sanitize(form.address, 200);
        const vArea = sanitize(form.area, 80);
        const vPhone = form.phone.trim() ? (isValidPhone(form.phone) ? form.phone.trim().substring(0, 20) : null) : null;

        if (!vName || !vAddress) {
          showToast(t("formRequiredError"));
          return;
        }
        if (form.phone.trim() && !vPhone) {
          showToast(t("invalidPhone"));
          return;
        }
        if (Date.now() - lastSubmit < 30000) {
          showToast(t("wait30s"));
          return;
        }

        setSubmitting(true);
        setLastSubmit(Date.now());
        let loc = formLoc;
        try {
          if (!loc && form.address.trim()) {
            const geo = await geocodeAddress(form.address, form.country === "DZ" ? "Algeria" : form.country);
            loc = { lat: geo.lat, lng: geo.lng };
          }
          if (!loc) loc = userLoc;

          const payload = {
            name: vName,
            area: vArea || form.city || "",
            address: vAddress,
            phone: vPhone,
            lat: loc.lat,
            lng: loc.lng,
            wilaya: form.country === "DZ" ? (WILAYAS.find(w => w.id === wilayaId)?.name || "سيدي بلعباس") : form.city || "🌍",
            commune: vArea || form.city || "",
            country: form.country,
            hours: { open: Number(form.open), close: Number(form.close) },
            onDuty: form.onDuty,
            verified: false,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          };

          const ref = await db.collection("pharmacies_submitted").add(payload);
          setSubmitted(prev => [...prev, { id: ref.id, ...payload }]);
          showToast(t("newPharmacySuccess"));
          setShowAddForm(false);
          setForm({ name: "", area: "", address: "", phone: "", open: 8, close: 21, onDuty: false, country: "DZ", city: "" });
          setFormLoc(null);
          setFormLocStatus(null);
        } catch {
          showToast(t("newPharmacyError"));
        } finally {
          setSubmitting(false);
        }
      };

      // Admin
      const submitLogin = async () => {
        setLoginError(null);
        setLoginLoading(true);
        try {
          await auth.signInWithEmailAndPassword(loginEmail.trim(), loginPassword);
          setShowLogin(false);
          setAdminView(true);
          setLoginPassword("");
        } catch {
          setLoginError(t("loginError"));
        } finally {
          setLoginLoading(false);
        }
      };

      const removePermanently = async (id, name) => {
        setRemovedIds(prev => new Set(prev).add(id));
        showToast(t("removedToast", { name }));
        try {
          if (typeof id === "string") {
            await db.collection("pharmacies_submitted").doc(id).delete();
            setSubmitted(prev => prev.filter(p => p.id !== id));
          } else {
            await db.collection("removed_pharmacies").doc(String(id)).set({
              name,
              removedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
          }
        } catch {}
      };

      const dismissComplaints = (id, name) => {
        setComplaints(prev => ({ ...prev, [id]: 0 }));
        showToast(t("dismissedToast", { name }));
      };

      // ═══════════════════════════════════════════════════════════
      // RENDER
      // ═══════════════════════════════════════════════════════════
      return (
        <div dir={dir} className={`min-h-screen ${dark ? "dark bg-brand-950 text-brand-50" : "bg-brand-50 text-stone-900"}`} style={{ fontFamily: lang === "ar" ? "'IBM Plex Sans Arabic', sans-serif" : "'IBM Plex Sans', sans-serif" }}>
          {/* Header */}
          <header className="sticky top-0 z-20 bg-brand-950 text-brand-50 px-4 pt-3 pb-4 rounded-b-2xl shadow-lg">
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <div className="w-8 h-8 rounded-lg bg-brand-700 flex items-center justify-center shadow-md">
                  <Icons.Cross className="w-4 h-4 text-brand-100" />
                </div>
                <div>
                  <h1 className="text-lg font-bold tracking-tight text-brand-400 leading-tight" dir="ltr">Pharis</h1>
                  <p className="text-[11px] text-brand-300">{currentPlace}</p>
                </div>
              </div>
              <div className="flex items-center gap-1.5">
                <button onClick={() => setDark(d => !d)} className="p-1.5 rounded-lg hover:bg-brand-900 transition" title={dark ? t("lightMode") : t("darkMode")}>
                  {dark ? <Icons.Sun className="w-4 h-4 text-brand-300" /> : <Icons.Moon className="w-4 h-4 text-brand-300" />}
                </button>
                <button onClick={() => adminUser ? setAdminView(true) : setShowLogin(true)} className="font-mono text-brand-400 text-[10px] border border-brand-800 rounded-md px-2 py-1 hover:bg-brand-900 transition">
                  {t("dashboard")}
                </button>
                <div className="font-mono text-brand-400 text-xs border border-brand-800 rounded-md px-2 py-1">{timeStr}</div>
              </div>
            </div>

            {/* Location button */}
            <button
              onClick={() => setShowLocationPicker(s => !s)}
              className={`mt-3 w-full flex items-center justify-between gap-2 rounded-xl px-3 py-2.5 border transition ${showLocationPicker ? "bg-brand-500 border-brand-400 text-brand-950" : "bg-brand-900 border-brand-700 text-brand-100 hover:bg-brand-800"}`}
            >
              <span className="flex items-center gap-2 text-sm font-medium">
                <Icons.MapPin className="w-4 h-4" />
                {t("tagline", { place: currentPlace })}
              </span>
              <span className={`text-xs font-semibold underline ${showLocationPicker ? "text-brand-950" : "text-brand-300"}`}>
                {t("changeLocation")}
              </span>
            </button>

            {/* Language */}
            <div className="flex gap-1.5 mt-2">
              {[{ code: "ar", label: "العربية" }, { code: "fr", label: "Français" }, { code: "en", label: "English" }].map(l => (
                <button
                  key={l.code}
                  onClick={() => setLang(l.code)}
                  className={`px-2.5 py-1 rounded-full text-xs font-medium transition ${lang === l.code ? "bg-brand-400 text-brand-950" : "bg-brand-900 text-brand-300"}`}
                >
                  {l.label}
                </button>
              ))}
            </div>

            {/* Location picker panel */}
            {showLocationPicker && (
              <div className="mt-3 bg-brand-950 rounded-2xl p-3 max-h-[55vh] overflow-y-auto border border-brand-800 space-y-3 scrollbar-thin animate-fade-in">
                <div>
                  <p className="text-xs text-brand-300 px-1 pb-2">{t("country")}</p>
                  <div className="grid grid-cols-2 gap-1">
                    {COUNTRIES.map(c => (
                      <button
                        key={c.id}
                        onClick={() => { setCountryId(c.id); setCityResults([]); setCitySearch(""); }}
                        className={`text-start text-xs px-2.5 py-1.5 rounded-lg transition truncate ${c.id === countryId ? "bg-brand-500 text-brand-950 font-medium" : "text-brand-200 hover:bg-brand-900"}`}
                      >
                        {lang === "ar" ? c.name : lang === "fr" ? c.nameFr : c.nameEn}
                      </button>
                    ))}
                  </div>
                </div>

                {countryId === "DZ" && (
                  <div className="pt-2 border-t border-brand-800">
                    <p className="text-xs text-brand-300 px-1 pb-2">الولاية</p>
                    <div className="grid grid-cols-2 gap-1">
                      {WILAYAS.filter(w => w.id !== 999).map(w => (
                        <button
                          key={w.id}
                          onClick={() => selectWilaya(w)}
                          className={`text-start text-xs px-2.5 py-1.5 rounded-lg transition ${w.id === wilayaId ? "bg-brand-500 text-brand-950 font-medium" : "text-brand-200 hover:bg-brand-900"}`}
                        >
                          {w.name}
                        </button>
                      ))}
                    </div>
                  </div>
                )}

                <div className="pt-2 border-t border-brand-800">
                  <p className="text-xs text-brand-300 px-1 pb-2">{t("searchCity")}</p>
                  <div className="flex gap-1.5">
                    <input
                      value={citySearch}
                      onChange={e => setCitySearch(e.target.value)}
                      onKeyDown={e => e.key === "Enter" && searchCityAndLoad()}
                      placeholder={t("searchCity")}
                      className="flex-1 bg-brand-900 placeholder-brand-600 text-brand-50 rounded-lg px-3 py-2 text-xs outline-none focus:ring-2 focus:ring-brand-500"
                    />
                    <button onClick={searchCityAndLoad} disabled={loadingCities} className="px-3 py-2 rounded-lg text-xs font-semibold bg-brand-700 text-brand-50 disabled:opacity-50">
                      {loadingCities ? "…" : "OK"}
                    </button>
                  </div>
                  {cityResults.length > 0 && (

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      render() {
        if (this.state.hasError) {
          return (
            <div style={{ padding: 24, fontFamily: "sans-serif", color: "#7f1d1d", background: "#fef2f2", direction: "rtl", textAlign: "right", minHeight: "100vh" }}>
              <h2 style={{ marginBottom: 12 }}>⚠️ حدث خطأ غير متوقع</h2>
              <p style={{ fontSize: 14, color: "#666", marginBottom: 16 }}>جرب تحديث الصفحة.</p>
              <button onClick={() => window.location.reload()} style={{ background: "#059669", color: "white", border: "none", padding: "10px 20px", borderRadius: 8, cursor: "pointer" }}>
                🔄 تحديث الصفحة
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById("root")).render(
      <ErrorBoundary>
        <PharisApp />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
