<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharis | صيدليات مفتوحة · قريبة منك</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <h1>📍 ✚ 💊 Pharis</h1>
            <p>دليلك الذكي للصيدليات الحية والمناوبة</p>
        </div>
        <div class="action-bar">
            <!-- زر تفعيل بروتوكول الطوارئ المطوّر المباشر -->
            <button id="emergency-btn" onclick="activateEmergencyLocation()">
                🚨 صيدليات الطوارئ الأقرب الآن
            </button>
        </div>
    </header>

    <main>
        <div class="search-section">
            <input type="text" id="search-input" placeholder="ابحث باسم الحي أو الشارع شعبياً وعريقاً...">
        </div>

        <div id="pharmacies-container" class="results-grid">
            <div class="loading-prompt">اضغط على زر الطوارئ أعلاه أو ابحث لجلب الأقرب بدقة متناهية...</div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
