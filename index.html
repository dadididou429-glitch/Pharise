// ─── Security ────────────────────────────────────────────────────
const Security = {
  sanitize: (dirty) => {
    if (typeof window !== 'undefined' && window.DOMPurify) {
      return window.DOMPurify.sanitize(String(dirty), { ALLOWED_TAGS: [], ALLOWED_ATTR: [] });
    }
    return String(dirty).replace(/[<>&\"-]/g, '');
  },
  validatePhone: (phone) => /^[+\d\s\-()]{6,20}$/.test((phone || '').trim()),
  validateInput: (text, maxLen) => {
    if (!text || !text.trim()) return null;
    const cleaned = Security.sanitize(text).substring(0, maxLen || 100).trim();
    return cleaned.length > 0 ? cleaned : null;
  },
  rateLimit: (lastTime, cooldownMs) => Date.now() - lastTime < (cooldownMs || 30000),
};

const Utils = {
  fmtHour: (h) => {
    const hh = Math.floor(h) % 24;
    const mm = Math.round((h - Math.floor(h)) * 60);
    return String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0");
  },
  haversine: (lat1, lng1, lat2, lng2) => {
    const R = 6371;
    const toRad = (x) => (x * Math.PI) / 180;
    const dLat = toRad(lat2 - lat1);
    const dLng = toRad(lng2 - lng1);
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  },
  computeStatus: (ph, now) => {
    const hour = now.getHours() + now.getMinutes() / 60;
    if (ph.onDuty) return { open: true, kind: "onDuty" };
    const open = (ph.hours && ph.hours.open) || 8;
    const close = (ph.hours && ph.hours.close) || 21;
    const isOpen = close > 24 ? hour >= open || hour < close - 24 : hour >= open && hour < close;
    return { open: isOpen, kind: isOpen ? "closesAt" : "opensAt", time: isOpen ? close % 24 : open };
  },
};

// ─── Hooks ───────────────────────────────────────────────────────
function useNow() {
  const [now, setNow] = useState(function() { return new Date(); });
  useEffect(function() {
    const t = setInterval(function() { setNow(new Date()); }, 30000);
    return function() { clearInterval(t); };
  }, []);
  return now;
}

function useDebounce(value, delay) {
  const [debounced, setDebounced] = useState(value);
  useEffect(function() {
    const handler = setTimeout(function() { setDebounced(value); }, delay);
    return function() { clearTimeout(handler); };
  }, [value, delay]);
  return debounced;
}

function useOnline() {
  const [online, setOnline] = useState(function() { return navigator.onLine; });
  useEffect(function() {
    const on = function() { setOnline(true); };
    const off = function() { setOnline(false); };
    window.addEventListener('online', on);
    window.addEventListener('offline', off);
    return function() { window.removeEventListener('online', on); window.removeEventListener('offline', off); };
  }, []);
  return online;
}

function useLocalStorage(key, initialValue) {
  const [stored, setStored] = useState(function() {
    try { var item = window.localStorage.getItem(key); return item ? JSON.parse(item) : initialValue; }
    catch(e) { return initialValue; }
  });
  const setValue = useCallback(function(value) {
    try {
      var valueToStore = typeof value === 'function' ? value(stored) : value;
      setStored(valueToStore);
      window.localStorage.setItem(key, JSON.stringify(valueToStore));
    } catch(err) { console.warn("localStorage error [" + key + "]:", err); }
  }, [key, stored]);
  return [stored, setValue];
}

function useGeolocation() {
  const [state, setState] = useState({ loc: CONFIG.DEFAULT_LOC, loading: true, error: null });
  useEffect(function() {
    if (!navigator.geolocation) { setState(function(s) { return { ...s, loading: false, error: 'unsupported' }; }); return; }
    navigator.geolocation.getCurrentPosition(
      function(pos) { setState({ loc: { lat: pos.coords.latitude, lng: pos.coords.longitude }, loading: false, error: null }); },
      function(err) { setState(function(s) { return { ...s, loading: false, error: err.code === 1 ? 'permission' : 'timeout' }; }); },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }
    );
  }, []);
  return state;
}

function useToast() {
  const [toast, setToast] = useState(null);
  const show = useCallback(function(msg, type) {
    setToast({ msg: msg, type: type || "info", id: Date.now() });
    setTimeout(function() { setToast(null); }, 3500);
  }, []);
  return { toast: toast, show: show };
}

var OSMService = {
  fetchPharmacies: function(lat, lng, radius) {
    radius = radius || CONFIG.OSM_RADIUS;
    var query = '[out:json][timeout:25];(node["amenity"="pharmacy"](around:' + radius + ',' + lat + ',' + lng + '););out body;';
    return fetch("https://overpass-api.de/api/interpreter?data=" + encodeURIComponent(query))
      .then(function(res) { if (!res.ok) throw new Error("Overpass failed"); return res.json(); })
      .then(function(data) {
        return data.elements.map(function(el, idx) {
          var t = el.tags || {};
          var name = t["name:fr"] || t["name:ar"] || t.name || "Pharmacie";
          var address = [t["addr:street"], t["addr:housenumber"], t["addr:city"]].filter(Boolean).join(", ") || "";
          var phone = t.phone || t["contact:phone"] || null;
          var open = 8, close = 21, onDuty = false;
          if (t.opening_hours && t.opening_hours.includes("24/7")) { onDuty = true; open = 0; close = 24; }
          return {
            id: "osm_" + el.id + "_" + idx,
            name: /^(Pharmacie|Pharmacy|صيدلية)/i.test(name) ? name : (name ? "Pharmacie " + name : "Pharmacie"),
            area: t["addr:city"] || t["addr:suburb"] || "", address: address, phone: phone,
            lat: el.lat, lng: el.lon, hours: { open: open, close: close }, onDuty: onDuty,
            wilaya: "OSM", commune: t["addr:city"] || "", verified: true, fromOSM: true
          };
        }).filter(function(p) { return p.lat && p.lng; });
      });
  },
  searchCities: function(query, countryCode) {
    if (!query.trim()) return Promise.resolve([]);
    var cc = countryCode === "OTHER" ? "" : countryCode;
    var url = "https://nominatim.openstreetmap.org/search?q=" + encodeURIComponent(query + (cc ? ", " + cc : "")) + "&format=json&addressdetails=1&limit=10&accept-language=fr";
    return fetch(url).then(function(res) { return res.json(); }).then(function(data) {
      return data.filter(function(item) { return ["city", "town", "village"].includes(item.type) || item.class === "place"; })
        .map(function(item) { return { name: item.display_name.split(",")[0], fullName: item.display_name, lat: parseFloat(item.lat), lng: parseFloat(item.lon), country: (item.address && item.address.country) || "" }; });
    });
  },
  geocodeAddress: function(address, countryHint) {
    var q = countryHint ? address + ", " + countryHint : address;
