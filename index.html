  <script>
    (function () {
      var boot = document.getElementById("pharis-boot");
      var hidden = false;
      // آخر حرف ~2.15+0.5+0.5=3.15 — استقرار ثم خروج
      var NAME_DONE_MS = 3300;
      var HOLD_NAME_MS = 1500;
      var FADE_MS = 450;
      var audioCtx = null;

      function music() {
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === "suspended") audioCtx.resume();
          var t0 = audioCtx.currentTime + 0.05;
          var master = audioCtx.createGain();
          master.gain.setValueAtTime(0.0001, t0);
          master.gain.exponentialRampToValueAtTime(0.09, t0 + 0.35);
          master.gain.setValueAtTime(0.09, t0 + 3.6);
          master.gain.exponentialRampToValueAtTime(0.0001, t0 + 4.8);
          master.connect(audioCtx.destination);
          function pad(f, s, d) {
            var o = audioCtx.createOscillator();
            var g = audioCtx.createGain();
            o.type = "sine"; o.frequency.value = f;
            g.gain.setValueAtTime(0.0001, t0 + s);
            g.gain.exponentialRampToValueAtTime(0.035, t0 + s + 0.2);
            g.gain.exponentialRampToValueAtTime(0.0001, t0 + s + d);
            o.connect(g); g.connect(master);
            o.start(t0 + s); o.stop(t0 + s + d);
          }
          function note(f, s, d, v) {
            var o = audioCtx.createOscillator();
            var g = audioCtx.createGain();
            o.type = "triangle"; o.frequency.value = f;
            g.gain.setValueAtTime(0.0001, t0 + s);
            g.gain.exponentialRampToValueAtTime(v || 0.06, t0 + s + 0.02);
            g.gain.exponentialRampToValueAtTime(0.0001, t0 + s + d);
            o.connect(g); g.connect(master);
            o.start(t0 + s); o.stop(t0 + s + d);
          }
          pad(261.63, 0, 4.2); pad(329.63, 0.12, 4.0); pad(392, 0.22, 3.9);
          note(392, 0.35, 0.35); note(523.25, 0.85, 0.4); note(659.25, 1.5, 0.45);
          note(523.25, 2.2, 0.35); note(783.99, 2.85, 0.5, 0.07);
        } catch (e) {}
      }
      music();
      document.addEventListener("pointerdown", function once() {
        try { if (audioCtx && audioCtx.state === "suspended") audioCtx.resume(); music(); } catch (e) {}
        document.removeEventListener("pointerdown", once);
      }, { once: true });

      function hideBoot() {
        if (hidden || !boot) return;
        hidden = true;
        boot.style.transition = "opacity " + (FADE_MS / 1000) + "s ease";
        boot.style.opacity = "0";
        try { if (audioCtx) setTimeout(function () { try { audioCtx.close(); } catch (e) {} }, 300); } catch (e) {}
        setTimeout(function () {
          if (boot && boot.parentNode) boot.parentNode.removeChild(boot);
        }, FADE_MS + 40);
      }
      window.__pharisHideBoot = function () {};
      setTimeout(hideBoot, NAME_DONE_MS + HOLD_NAME_MS);
    })();
  </script>

    // تطبيع النص للبحث (عربي + لاتيني)
    function normalizeSearch(s) {
      return String(s || "")
        .toLowerCase()
        .normalize("NFKD")
        .replace(/[\u064B-\u065F\u0670]/g, "") // تشكيل
        .replace(/\u0640/g, "") // تطويل
        .replace(/[أإآٱ]/g, "ا")
        .replace(/[ىئ]/g, "ي")
        .replace(/ة/g, "ه")
        .replace(/[^\p{L}\p{N}\s]/gu, " ")
        .replace(/\s+/g, " ")
        .trim();
    }
    function matchesSearch(ph, qRaw) {
      const q = normalizeSearch(qRaw);
      if (!q) return true;
      const hay = normalizeSearch([ph.name, ph.area, ph.address, ph.wilaya, ph.commune, ph.phone].filter(Boolean).join(" "));
      // كل كلمة في البحث يجب أن توجد
      return q.split(" ").every(w => w && hay.includes(w));
    }

    const COMPLAINT_THRESHOLD = 3;

    function useNow() {
      const [now, setNow] = useState(() => new Date());
      useEffect(() => {
        const t = setInterval(() => setNow(new Date()), 30000);
        return () => clearInterval(t);
      }, []);
      return now;
    }

    function computeStatus(ph, now) {
      if (ph.onDuty) return { open: true, kind: "onDuty" };
      const hour = now.getHours() + now.getMinutes() / 60;
      const { open, close } = ph.hours || { open: 8, close: 21 };
      const isOpen = close > 24 ? (hour >= open || hour < close - 24) : (hour >= open && hour < close);
      return { open: isOpen, kind: isOpen ? "closesAt" : "opensAt", time: isOpen ? close % 24 : open };
    }

    function fmtHour(h) {
      const hh = Math.floor(h) % 24;
      const mm = Math.round((h - Math.floor(h)) * 60);
      return String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0");
    }

    function haversine(lat1, lng1, lat2, lng2) {
      const R = 6371;
      const dLat = ((lat2 - lat1) * Math.PI) / 180;
      const dLng = ((lng2 - lng1) * Math.PI) / 180;
      const a = Math.sin(dLat / 2) ** 2 + Math.cos((lat1 * Math.PI) / 180) * Math.cos((lat2 * Math.PI) / 180) * Math.sin(dLng / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function sanitize(text, max = 100) {
      if (!text || typeof text !== "string") return null;
      const cleaned = text.trim().replace(/[<>\x00-\x1F\x7F]/g, "").substring(0, max);
      return cleaned.length > 0 ? cleaned : null;
    }

    function isValidPhone(phone) {
      if (!phone) return true;
      return /^[+\d\s\-()]{6,20}$/.test(phone.trim());
    }

    async function searchCities(query, countryCode) {
      if (!query.trim()) return [];
      const cc = countryCode === "OTHER" ? "" : countryCode;
      const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query + (cc ? ", " + cc : ""))}&format=json&addressdetails=1&limit=8&accept-language=ar,en,fr`;
      const res = await fetch(url, { headers: { "Accept-Language": "ar,en,fr" } });
      const data = await res.json();
      return data
        .filter(item => ["city", "town", "village", "municipality"].includes(item.type) || item.class === "place")
        .map(item => ({
          name: item.display_name.split(",")[0],
          fullName: item.display_name,
          lat: parseFloat(item.lat),
          lng: parseFloat(item.lon),
          country: item.address?.country || ""
        }));
    }

    async function geocodeAddress(address, countryHint) {
      const q = countryHint ? `${address}, ${countryHint}` : address;
      const res = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1&addressdetails=1`);
      const data = await res.json();
      if (!data.length) throw new Error("Address not found");
      return {
        lat: parseFloat(data[0].lat),
        lng: parseFloat(data[0].lon),
        displayName: data[0].display_name,
        city: data[0].address?.city || data[0].address?.town || data[0].address?.village || "",
        countryCode: (data[0].address?.country_code || "").toUpperCase()
      };
    }

    const OVERPASS_ENDPOINTS = [
      "https://overpass-api.de/api/interpreter",
      "https://overpass.kumi.systems/api/interpreter",
      "https://overpass.nchc.org.tw/api/interpreter",
      "https://maps.mail.ru/osm/tools/overpass/api/interpreter",
    ];

    function parseOpeningHours(oh) {
      if (!oh) return { open: 8, close: 21, onDuty: false };
      const s = String(oh).toLowerCase().replace(/\s/g, "");
      if (s.includes("24/7") || s === "24hours" || s.includes("mo-su00:00-24:00")) {
        return { open: 0, close: 24, onDuty: true };
      }
      // Try to extract first time range like 08:00-22:00
      const m = oh.match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);
      if (m) {
        const open = parseInt(m[1], 10) + parseInt(m[2], 10) / 60;
        let close = parseInt(m[3], 10) + parseInt(m[4], 10) / 60;
        if (close <= open) close += 24;
        return { open, close, onDuty: false };
      }
      return { open: 8, close: 21, onDuty: false };
    }

    function mapOSMElement(el, idx, defaultCity = "") {
      const t = el.tags || {};
      // Ways have center from "out center"
      const lat = el.lat || el.center?.lat;
      const lng = el.lon || el.center?.lon;
      if (!lat || !lng) return null;

      const rawName = t["name:ar"] || t["name:fr"] || t.name || t["brand"] || "";
      const name = rawName
        ? (/صيدلية|pharmacie|pharmacy|صيدليه/i.test(rawName) ? rawName : `صيدلية ${rawName}`)
        : (defaultCity ? `صيدلية ${defaultCity}` : "صيدلية");

      const hours = parseOpeningHours(t.opening_hours);
      const address = [
        t["addr:housenumber"],
        t["addr:street"] || t["addr:place"],
        t["addr:suburb"] || t["addr:quarter"],
        t["addr:city"]
      ].filter(Boolean).join(", ");

      return {
        id: `osm_${el.type || "n"}_${el.id}`,
        name,
        area: t["addr:suburb"] || t["addr:city"] || t["addr:district"] || t["addr:municipality"] || defaultCity,
        address: address || defaultCity,
        phone: t.phone || t["contact:phone"] || t["contact:mobile"] || t.mobile || null,
        lat,
        lng,
        hours: { open: hours.open, close: hours.close },
        onDuty: hours.onDuty,
        wilaya: defaultCity || "OSM",
        commune: t["addr:city"] || defaultCity,
        verified: true,
        fromOSM: true,
        openingHoursRaw: t.opening_hours || null
      };
    }

    function dedupePharmacies(list) {
      const seen = new Set();
      return list.filter(p => {
        if (!p) return false;
        // Dedupe by rounded coords + name
        const key = `${p.lat.toFixed(4)}_${p.lng.toFixed(4)}_${(p.name || "").slice(0, 20)}`;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    function getOSMCache(key) {
      try {
        const raw = localStorage.getItem("pharis_osm_" + key);
        if (!raw) return null;
        const { ts, data } = JSON.parse(raw);
        if (Date.now() - ts > 3 * 60 * 60 * 1000) return null; // 3h
        return data;
      } catch { return null; }
    }
    function setOSMCache(key, data) {
      try {
        localStorage.setItem("pharis_osm_" + key, JSON.stringify({ ts: Date.now(), data }));
      } catch {}
    }

    async function overpassFetch(query) {
      let lastErr;
      for (const endpoint of OVERPASS_ENDPOINTS) {
        try {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 20000);
          const res = await fetch(endpoint, {
            method: "POST",
            body: "data=" + encodeURIComponent(query),
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            signal: controller.signal
          });
          clearTimeout(timer);
          if (!res.ok) throw new Error("HTTP " + res.status);
          const data = await res.json();
          if (!data.elements) throw new Error("Invalid response");
          return data;
        } catch (e) {
          lastErr = e;
        }
      }
      throw lastErr || new Error("All Overpass endpoints failed");
    }

    // Core: fetch pharmacies around a point — improved (more tags + auto radius)
    async function fetchOSMPharmacies(lat, lng, radius = 15000) {
      const cacheKey = `near_${lat.toFixed(3)}_${lng.toFixed(3)}_${radius}`;
      const cached = getOSMCache(cacheKey);
      if (cached && cached.length > 0) return cached;

      const query = `[out:json][timeout:18];
(
  node["amenity"="pharmacy"](around:${radius},${lat},${lng});
  way["amenity"="pharmacy"](around:${radius},${lat},${lng});
  relation["amenity"="pharmacy"](around:${radius},${lat},${lng});
  node["healthcare"="pharmacy"](around:${radius},${lat},${lng});
  way["healthcare"="pharmacy"](around:${radius},${lat},${lng});
  node["shop"="pharmacy"](around:${radius},${lat},${lng});
  way["shop"="pharmacy"](around:${radius},${lat},${lng});
  node["dispensing"="yes"](around:${radius},${lat},${lng});
);
out center tags;`;

      const data = await overpassFetch(query);
      const result = dedupePharmacies(
        (data.elements || []).map((el, idx) => mapOSMElement(el, idx))
      );
      if (result.length > 0) setOSMCache(cacheKey, result);
      return result;
    }

    // Auto-expand radius when few results (does not change function signature)
    async function fetchOSMPharmaciesSmart(lat, lng) {
      let result = [];
      for (const radius of [15000, 25000, 40000]) {
        result = await fetchOSMPharmacies(lat, lng, radius);
        if (result.length >= 8) break;
      }
      return result;
    }

    // Fetch by city name — uses coordinates when available (fast path)
    async function fetchOSMByCity(cityName, lat, lng) {
      const cacheKey = "city_" + String(cityName).toLowerCase().replace(/\s+/g, "_").slice(0, 50);
      const cached = getOSMCache(cacheKey);
      if (cached && cached.length > 0) return cached;

      let cityLat = lat;
      let cityLng = lng;
      let displayCity = cityName;

      if (!cityLat || !cityLng) {
        const geoRes = await fetch(
          `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(cityName)}&format=json&limit=1`,
          { headers: { "Accept-Language": "ar,en,fr" } }
        );
        const geoData = await geoRes.json();
        if (!geoData.length) throw new Error("City not found");
        cityLat = parseFloat(geoData[0].lat);
        cityLng = parseFloat(geoData[0].lon);
        displayCity = geoData[0].display_name.split(",")[0];
      }

      // Try increasing radius if few results (city centers vs suburbs)
      let result = [];
      for (const radius of [15000, 25000, 40000]) {
        result = await fetchOSMPharmacies(cityLat, cityLng, radius);
        if (result.length >= 8) break;
      }

      const tagged = result.map(p => ({
        ...p,
        wilaya: displayCity,
        commune: p.commune || displayCity,
        area: p.area || displayCity
      }));
      if (tagged.length > 0) setOSMCache(cacheKey, tagged);
      return tagged;
    }

    function MapView({ pharmacies, userLoc, lang, onSelect }) {
      const mapRef = useRef(null);
      const mapInstance = useRef(null);
      const markersLayer = useRef(null);
      const userMarker = useRef(null);

      // إنشاء الخريطة مرة واحدة
      useEffect(() => {
        if (!mapRef.current || mapInstance.current) return;
        const map = L.map(mapRef.current, { zoomControl: false }).setView(
          [userLoc.lat, userLoc.lng],
          13
        );
        L.control.zoom({ position: "bottomright" }).addTo(map);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          attribution: "© OpenStreetMap",
        }).addTo(map);
        markersLayer.current = L.layerGroup().addTo(map);
        mapInstance.current = map;
        return () => {
          map.remove();
          mapInstance.current = null;
          markersLayer.current = null;
          userMarker.current = null;
        };
      }, []);

      // تحديث العلامات والموقع عند التغيير
      useEffect(() => {
        const map = mapInstance.current;
        if (!map || !markersLayer.current) return;

        markersLayer.current.clearLayers();
        if (userMarker.current) {
          map.removeLayer(userMarker.current);
        }

        const youAreHere =
          lang === "ar" ? "📍 أنت هنا" : lang === "fr" ? "📍 Vous êtes ici" : "📍 You are here";
        const openLabel =
          lang === "ar" ? "🟢 مفتوحة" : lang === "fr" ? "🟢 Ouverte" : "🟢 Open";
        const closedLabel =
          lang === "ar" ? "🔴 مغلقة" : lang === "fr" ? "🔴 Fermée" : "🔴 Closed";

        userMarker.current = L.circleMarker([userLoc.lat, userLoc.lng], {
          radius: 9,
          fillColor: "#3b82f6",
          color: "#fff",
          weight: 2.5,
          fillOpacity: 0.95,
        })
          .addTo(map)
          .bindPopup(youAreHere);

        const markers = [];
        pharmacies.forEach((ph) => {
          if (!ph.lat || !ph.lng) return;
          const color = ph.status.open ? "#059669" : "#dc2626";
          const m = L.circleMarker([ph.lat, ph.lng], {
            radius: 11,
            fillColor: color,
            color: "#fff",
            weight: 2,
            fillOpacity: 0.9,
          });
          m.bindPopup(`<div style="font-family:sans-serif;text-align:${
            lang === "ar" ? "right" : "left"
          };direction:${lang === "ar" ? "rtl" : "ltr"};min-width:180px;padding:2px">
            <b style="color:#064e3b">${ph.name}</b><br/>
            <span style="font-size:12px;color:#666">${ph.area || ""}</span><br/>
            <span style="font-size:12px;font-weight:600;color:${
              ph.status.open ? "#059669" : "#dc2626"
            }">${ph.status.open ? openLabel : closedLabel}</span>
          </div>`);
          m.on("click", () => onSelect && onSelect(ph));
          markersLayer.current.addLayer(m);
          markers.push(m);
        });

        if (markers.length > 0) {
          const group = L.featureGroup(markers);
          map.fitBounds(group.getBounds().pad(0.12));
        } else {
          map.setView([userLoc.lat, userLoc.lng], 13);
        }
      }, [pharmacies, userLoc, lang, onSelect]);

      return <div ref={mapRef} className="w-full h-full min-h-[50vh] rounded-2xl" />;
    }

    function useDebounce(value, delay) {
      const [debounced, setDebounced] = useState(value);
      useEffect(() => {
        const timer = setTimeout(() => setDebounced(value), delay);
        return () => clearTimeout(timer);
      }, [value, delay]);
      return debounced;
    }

      const LOCAL_WILAYA_NAMES = {

          const key = Number(p.lat).toFixed(3) + "," + Number(p.lng).toFixed(3);
          return !localKeys.has(key);
        });
        // المحلي أولاً — زر التحديث يحدّث OSM كالعادة
        return [...rawFiltered, ...submittedNear, ...osmUnique];
      }, [submitted, osmPharmacies, removedIds, wilayaId, userLoc.lat, userLoc.lng]);

      const allComputed = useMemo(() => {
        return baseList
          .filter(ph => !isRemovedPh(ph))
          .map(ph => {
            const status = computeStatus(ph, now);
            const hasCoords = Number.isFinite(Number(ph.lat)) && Number.isFinite(Number(ph.lng))
              && Number.isFinite(Number(userLoc.lat)) && Number.isFinite(Number(userLoc.lng));
            const distance = hasCoords
              ? haversine(userLoc.lat, userLoc.lng, Number(ph.lat), Number(ph.lng))
              : 99999;
            const complaintCount = complaints[ph.id] || complaints[String(ph.id)] || 0;
            const r = ratings[ph.id] || ratings[String(ph.id)] || { sum: ph.ratingSum || 0, count: ph.ratingCount || 0 };
            const isFeatured = !!(ph.featured || featuredMap[ph.id] || featuredMap[String(ph.id)]);
            return {
              ...ph,
              featured: isFeatured,
              status,
              distance,
              complaintCount,
              underReview: complaintCount >= COMPLAINT_THRESHOLD,
              avgRating: r.count > 0 ? r.sum / r.count : null,
              ratingCount: r.count,
              isFavorite: favorites.has(ph.id) || favorites.has(String(ph.id))
            };
          });
      }, [baseList, now, complaints, removedIds, ratings, favorites, userLoc, featuredMap]);

      const list = useMemo(() => {
        return allComputed
          .filter(ph => matchesSearch(ph, query))
          .filter(ph => filter === "open" ? ph.status.open : true)
          .filter(ph => filter === "urgent" ? ph.onDuty : true)
          .filter(ph => filter === "favorites" ? ph.isFavorite : true)
          .filter(ph => filter === "late" ? (ph.status.open && (ph.hours?.close > 22 || ph.onDuty)) : true)
          .sort((a, b) => {
            // 1) المميزة أولاً (اشتراك)
            if (!!a.featured !== !!b.featured) return a.featured ? -1 : 1;
            // 2) المفتوحة قبل المغلقة
            if (!!a.status?.open !== !!b.status?.open) return a.status?.open ? -1 : 1;
            // 3) المناوبة 24س
            if (!!a.onDuty !== !!b.onDuty) return a.onDuty ? -1 : 1;
            // 4) الأقرب فالأقرب
            return (a.distance ?? 99999) - (b.distance ?? 99999);
          });
      }, [allComputed, query, filter]);

      const openCount = list.filter(p => p.status.open).length;

      // Emergency: top open pharmacies by distance (max 8)
      const emergencyList = useMemo(() => {
        return allComputed
          .filter(ph => ph.status.open)
          .sort((a, b) => {
            if (!!a.featured !== !!b.featured) return a.featured ? -1 : 1;
            if (a.onDuty !== b.onDuty) return a.onDuty ? -1 : 1;
            return (a.distance ?? 99999) - (b.distance ?? 99999);
          })
          .slice(0, 8);
      }, [allComputed]);

      const reviewQueue = useMemo(() => {
        return RAW
          .filter(ph => !removedIds.has(ph.id))
          .map(ph => ({ ...ph, complaintCount: complaints[ph.id] || 0 }))
          .filter(ph => ph.complaintCount >= COMPLAINT_THRESHOLD)
          .sort((a, b) => b.complaintCount - a.complaintCount);
      }, [complaints, removedIds]);

      const selectedLive = selected ? allComputed.find(p => p.id === selected.id) || selected : null;
      const timeStr = now.toLocaleTimeString(lang === "ar" ? "ar-DZ" : lang === "fr" ? "fr-FR" : "en-GB", { hour: "2-digit", minute: "2-digit" });

      // Actions
      const showToast = (msg) => setToast(msg);

      const handleInstall = async () => {
        const prompt = window.__pharisInstallPrompt;
        if (!prompt) return;
        prompt.prompt();
        const result = await prompt.userChoice;
        if (result.outcome === "accepted") setCanInstall(false);
        window.__pharisInstallPrompt = null;
      };

      const shareApp = () => {
        const apkUrl = "https://github.com/dadididou429-glitch/Pharise/releases/download/V1.0/Pharise.apk";
        const shareText = lang === "ar" 
          ? "🚀 حمّل تطبيق Pharis واعثر على أقرب صيدلية مفتوحة!"
          : lang === "fr"
          ? "🚀 Téléchargez Pharis et trouvez la pharmacie ouverte la plus proche !"
          : "🚀 Download Pharis and find the nearest open pharmacy!";

        if (navigator.share) {
          navigator.share({ title: "Pharis - Open Pharmacies", text: shareText, url: apkUrl }).catch(() => {});
        } else {
          const fullText = shareText + "\n\n" + apkUrl;
          navigator.clipboard.writeText(fullText).then(() => {
            showToast(lang === "ar" ? "✅ تم نسخ رابط التحميل!" : lang === "fr" ? "✅ Lien copié!" : "✅ Link copied!");
          }).catch(() => { window.open(apkUrl, "_blank"); });
        }
      };

      const copyDownloaderCode = () => {
        navigator.clipboard.writeText("5040717").then(() => {
          showToast(lang === "ar" ? "✅ تم نسخ الكود 5040717!" : lang === "fr" ? "✅ Code 5040717 copié!" : "✅ Code 5040717 copied!");
        }).catch(() => { showToast("5040717"); });
      };

      const toggleFavorite = (id, name) => {
        setFavorites(prev => {
          const next = new Set(prev);
          if (next.has(id)) {
            next.delete(id);
            showToast(t("removedFavorite", { name }));
          } else {
            next.add(id);
            showToast(t("addedFavorite", { name }));
          }
          try { localStorage.setItem("pharis_favorites", JSON.stringify([...next])); } catch {}
          return next;
        });
      };

      const confirmStatus = (id, isOpen) => {
        setStatusConfirms(prev => {
          const cur = prev[id] || { open: 0, closed: 0 };
          const next = {
            ...prev,
            [id]: isOpen
              ? { open: cur.open + 1, closed: cur.closed }
              : { open: cur.open, closed: cur.closed + 1 }
          };
          try { localStorage.setItem("pharis_confirms", JSON.stringify(next)); } catch {}
          return next;
        });
        showToast(t("thanksConfirm"));
      };

      const reportPharmacy = (id, name) => {
        if (reportedByMe.has(id)) {
          showToast(t("alreadyReported"));
          return;
        }
        setComplaints(prev => {
          const next = { ...prev, [id]: (prev[id] || 0) + 1 };
          showToast(next[id] === COMPLAINT_THRESHOLD ? t("thresholdReached", { n: COMPLAINT_THRESHOLD, name }) : t("thanksReport"));
          return next;
        });
        setReportedByMe(prev => new Set(prev).add(id));
      };

      const submitRating = (id) => {
        if (draftStars === 0) {
          showToast(t("pickStarsFirst"));
          return;
        }
        setRatings(prev => {
          const cur = prev[id] || { sum: 0, count: 0 };
          const already = myReviews[id];
          const sum = already ? cur.sum - already.stars + draftStars : cur.sum + draftStars;
          const count = already ? cur.count : cur.count + 1;
          const next = { ...prev, [id]: { sum, count } };
          try { localStorage.setItem("pharis_ratings", JSON.stringify(next)); } catch {}
          return next;
        });
        setMyReviews(prev => {
          const next = { ...prev, [id]: { stars: draftStars, text: draftText } };
          try { localStorage.setItem("pharis_my_reviews", JSON.stringify(next)); } catch {}
          return next;
        });
        showToast(t("reviewSubmitted"));
      };

      

      

      

      

      

      

      // تغيير الولاية يدويًا + جلب الصيدليات تلقائيًا
      const selectWilaya = (w) => {
        if (!w || !w.enabled) return;
        setWilayaId(w.id);
        const countryName = lang === "ar" ? "الجزائر" : lang === "fr" ? "Algérie" : "Algeria";
        const cityLabel = lang === "ar" ? w.name : lang === "fr" ? (w.nameFr || w.name) : (w.nameEn || w.name);
        const display = w.id === 999
          ? (lang === "ar" ? "قريب منك" : lang === "fr" ? "Près de vous" : "Near you")
          : `${cityLabel}، ${countryName}`;
        setCurrentPlace(display);
        setShowLocationPicker(false);
        setCountryId("DZ");

        // امسح نتائج OSM القديمة فوراً حتى لا تبقى صيدليات المدينة السابقة
        setOsmPharmacies([]);

        if (w.id !== 999 && Number.isFinite(Number(w.lat)) && Number.isFinite(Number(w.lng))) {
          const lat = Number(w.lat);
          const lng = Number(w.lng);
          setUserLoc({ lat, lng });
          setLoadingOSM(true);
          // نصف قطر أوسع عند اختيار ولاية يدوياً
          fetchOSMPharmaciesSmart(lat, lng)
            .then((data) => {
              setOsmPharmacies(Array.isArray(data) ? data : []);
            })
            .catch(() => {
              setOsmPharmacies([]);
            })
            .finally(() => setLoadingOSM(false));
          try {
            localStorage.setItem("pharis_last_loc", JSON.stringify({
              lat, lng, place: display, countryId: "DZ", wilayaId: w.id, ts: Date.now()
            }));
          } catch {}
        } else if (userLoc && Number.isFinite(Number(userLoc.lat))) {
          setLoadingOSM(true);
          fetchOSMPharmaciesSmart(userLoc.lat, userLoc.lng)
            .then((data) => {
              setOsmPharmacies(Array.isArray(data) ? data : []);
            })
            .catch(() => setOsmPharmacies([]))
            .finally(() => setLoadingOSM(false));
        }
      };

      // Add pharmacy
      const captureFormLocation = () => {
        if (!navigator.geolocation) {
          setFormLocStatus("failed");
          return;
        }
        setFormLocStatus("loading");
        navigator.geolocation.getCurrentPosition(
          pos => {
            setFormLoc({ lat: pos.coords.latitude, lng: pos.coords.longitude });
            setFormLocStatus("ok");
          },
          () => setFormLocStatus("failed"),
          { timeout: 8000 }
        );
      };

      const submitNewPharmacy = async () => {
        const vName = sanitize(form.name, 80);
        const vAddress = sanitize(form.address, 200);
        const vArea = sanitize(form.area, 80);
        const vPhone = form.phone.trim() ? (isValidPhone(form.phone) ? form.phone.trim().substring(0, 20) : null) : null;

        if (!vName || !vAddress) {
          showToast(t("formRequiredError"));
          return;
        }
        if (form.phone.trim() && !vPhone) {
          showToast(t("invalidPhone"));
          return;
        }
        if (Date.now() - lastSubmit < 30000) {
          showToast(t("wait30s"));
          return;
        }

        setSubmitting(true);
        setLastSubmit(Date.now());
        let loc = formLoc;
        try {
          if (!loc && form.address.trim()) {
            const geo = await geocodeAddress(form.address, form.country === "DZ" ? "Algeria" : form.country);
            loc = { lat: geo.lat, lng: geo.lng };
          }
          if (!loc) loc = userLoc;

          const payload = {
            name: vName,
            area: vArea || form.city || "",
            address: vAddress,
            phone: vPhone,
            lat: loc.lat,
            lng: loc.lng,
            wilaya: form.country === "DZ" ? (WILAYAS.find(w => w.id === wilayaId)?.name || "سيدي بلعباس") : form.city || "🌍",
            commune: vArea || form.city || "",
            country: form.country,
            hours: { open: Number(form.open), close: Number(form.close) },
            onDuty: form.onDuty,
            verified: false,
            featured: false,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          };


          // كود التفعيل — التحقق أولاً دون تغيير payload (القواعد تفرض verified==false عند الإنشاء)
          const codeRaw = (form.activationCode || "").trim().toUpperCase();
          let codeActivated = false;
          if (codeRaw && db) {
            try {
              const codeRef = db.collection("activation_codes").doc(codeRaw);
              const codeSnap = await codeRef.get();
              if (codeSnap.exists && codeSnap.data().used !== true) {
                codeActivated = true;
              } else {
                showToast(t("activationBad"));
                setSubmitting(false);
                return;
              }
            } catch (e) {
              console.warn("activation code error", e);
              showToast(t("activationBad"));
              setSubmitting(false);
              return;
            }
          }

          // دائماً غير موثّقة عند الإنشاء (متوافق مع Firestore Rules)
          payload.verified = false;
          payload.featured = false;

          const ref = await db.collection("pharmacies_submitted").add(payload);

          if (codeActivated && db) {
            try {
              const codeRef = db.collection("activation_codes").doc(codeRaw);
              await codeRef.set({
                used: true,
                usedAt: firebase.firestore.FieldValue.serverTimestamp(),
                pharmacyName: payload.name,
                wilaya: payload.wilaya || "",
                pharmacyId: ref.id
              }, { merge: true });
              await db.collection("pharmacy_features").doc(ref.id).set({
                featured: true,
                verified: true,
                activatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                code: codeRaw
              });
              setFeaturedMap(prev => ({ ...prev, [ref.id]: true, [String(ref.id)]: true }));
            } catch (e) {
              console.warn("feature activation error", e);
              showToast(lang === "ar" ? "تم التسجيل لكن تعذّر تفعيل الشارة — تواصل عبر واتساب" : lang === "fr" ? "Enregistré mais badge non activé — contactez WhatsApp" : "Saved but badge failed — contact WhatsApp");
            }
          }
          setSubmitted(prev => [...prev, { id: ref.id, ...payload }]);
          showToast(codeActivated ? t("activationOk") : t("newPharmacySuccess"));
          if (analytics) analytics.logEvent("pharmacy_submitted", { country: form.country, featured: codeActivated });
          setShowAddForm(false);
          setForm({ name: "", area: "", address: "", phone: "", open: 8, close: 21, onDuty: false, country: "DZ", city: "", activationCode: "" });
          setFormLoc(null);
          setFormLocStatus(null);
        } catch {
          showToast(t("newPharmacyError"));
        } finally {
          setSubmitting(false);
        }
      };

      // Admin
      const submitLogin = async () => {
        setLoginError(null);
        setLoginLoading(true);
        try {
          if (!auth) {
            setLoginError(lang === "ar" ? "Firebase غير جاهز" : "Firebase not ready");
            return;
          }
          const email = loginEmail.trim();
          const pass = loginPassword;
          if (!email || !pass) {
            setLoginError(lang === "ar" ? "أدخل البريد وكلمة المرور" : "Enter email and password");
            return;
          }
          const cred = await auth.signInWithEmailAndPassword(email, pass);
          const u = cred.user;

          // الأدمن الأساسي دائماً مسموح + تسجيله في admins
          let allowed = (u.uid === PRIMARY_ADMIN_UID);
          if (allowed && db) {
            try {
              await db.collection("admins").doc(u.uid).set({
                email: u.email || email,
                primary: true,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
              }, { merge: true });
            } catch (e) { console.warn("admins bootstrap", e); }
          }
          if (!allowed && db) {
            try {
              const doc = await db.collection("admins").doc(u.uid).get();
              allowed = doc.exists;
            } catch (e) {
              console.warn(e);
              // إن فشل قراءة admins بسبب القواعد، لا تمنع الأدمن الأساسي فقط
              allowed = false;
            }
          }
          if (!allowed) {
            await auth.signOut();
            setLoginError(
              lang === "ar"
                ? "هذا الحساب ليس ضمن المشرفين. أضفه من تبويب المشرفون أو استخدم حساب الأدمن الأساسي."
                : lang === "fr"
                ? "Ce compte n'est pas admin."
                : "This account is not an admin."
            );
            return;
          }
          setShowLogin(false);
          setAdminView(true);
          setLoginPassword("");
        } catch (e) {
          console.error(e);
          const code = e && e.code ? e.code : "";
          if (code === "auth/invalid-email") {
            setLoginError(lang === "ar" ? "بريد غير صالح" : "Invalid email");
          } else if (code === "auth/user-not-found" || code === "auth/wrong-password" || code === "auth/invalid-credential") {
            setLoginError(lang === "ar" ? "البريد أو كلمة المرور غير صحيحة" : lang === "fr" ? "Email ou mot de passe incorrect" : "Wrong email or password");
          } else if (code === "auth/too-many-requests") {
            setLoginError(lang === "ar" ? "محاولات كثيرة — انتظر قليلاً" : "Too many attempts — wait");
          } else {
            setLoginError((lang === "ar" ? "خطأ: " : "Error: ") + (code || (e && e.message) || t("loginError")));
          }
        } finally {
          setLoginLoading(false);
        }
      };

      const addAdminAccount = async () => {
        setAdminMgmtMsg("");
        const uid = newAdminUid.trim();
        if (!uid || uid.length < 10) {
          setAdminMgmtMsg(lang === "ar" ? "أدخل User UID صالحاً من Firebase Authentication" : "Enter a valid Firebase User UID");
          return;
        }
        if (!adminUser || !db) return;
        try {
          await db.collection("admins").doc(uid).set({
            email: newAdminEmail.trim() || "",
            addedBy: adminUser.uid,
            addedAt: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true });
          setAdminList(prev => {
            const rest = prev.filter(a => a.id !== uid);
            return [...rest, { id: uid, email: newAdminEmail.trim(), addedBy: adminUser.uid }];
          });
          setNewAdminUid("");
          setNewAdminEmail("");
          setAdminMgmtMsg(lang === "ar" ? "✓ تم إضافة الأدمن" : lang === "fr" ? "✓ Admin ajouté" : "✓ Admin added");
        } catch (e) {
          console.error(e);
          setAdminMgmtMsg(lang === "ar" ? "فشل الإضافة — تحقق من قواعد Firestore" : "Failed — check Firestore rules");
        }
      };

      const removeAdminAccount = async (uid) => {
        if (uid === PRIMARY_ADMIN_UID) {
          setAdminMgmtMsg(lang === "ar" ? "لا يمكن حذف الأدمن الأساسي" : "Cannot remove primary admin");
          return;
        }
        try {
          await db.collection("admins").doc(uid).delete();
          setAdminList(prev => prev.filter(a => a.id !== uid));
          setAdminMgmtMsg(lang === "ar" ? "تم حذف الأدمن" : "Admin removed");
        } catch (e) {
          setAdminMgmtMsg(lang === "ar" ? "فشل الحذف" : "Remove failed");
        }
      };

      const removePermanently = async (id, name, ph) => {
        if (!adminUser) {
          showToast(lang === "ar" ? "يجب تسجيل دخول الأدمن أولاً للحذف النهائي" : lang === "fr" ? "Connexion admin requise" : "Admin login required");
          return;
        }
        const fp = ph ? pharmacyFingerprint(ph) : null;
        // إخفاء فوري من الواجهة
        setRemovedIds(prev => {
          const next = new Set(prev);
          next.add(id);
          next.add(String(id));
          if (id != null && !isNaN(id)) next.add(Number(id));
          if (fp) next.add(fp);
          return next;
        });
        setSubmitted(prev => prev.filter(p => p.id !== id && String(p.id) !== String(id)));
        showToast(t("removedToast", { name: name || "" }));

        try {
          if (!db) throw new Error("no db");
          // قائمة الحذف الدائمة (لكل الأنواع: محلي / مُرسل / OSM)
          const removedDoc = {
            name: name || "",
            removedAt: firebase.firestore.FieldValue.serverTimestamp(),
            fingerprint: fp || null,
            sourceId: id
          };
          await db.collection("removed_pharmacies").doc(String(id)).set(removedDoc, { merge: true });
          // إن وُجدت بصمة مختلفة كمفتاح إضافي
          if (fp) {
            await db.collection("removed_pharmacies").doc("fp_" + fp.replace(/[^a-z0-9|.-]/gi, "_").slice(0, 120)).set(removedDoc, { merge: true });
          }
          // حذف من الصيدليات المُرسلة إن كان المعرّف من Firestore
          if (typeof id === "string" && id.length > 8) {
            try {
              await db.collection("pharmacies_submitted").doc(id).delete();
            } catch (e) {
              console.warn("submitted delete", e);
            }
          }
          // إزالة الشارة إن وُجدت
          try {
            await db.collection("pharmacy_features").doc(String(id)).delete();
          } catch (e) {}
        } catch (e) {
          console.error(e);
          showToast(lang === "ar" ? "فشل الحفظ على السيرفر — تحقق من صلاحيات الأدمن" : "Server delete failed — check admin rights");
        }
      };

      const dismissComplaints = (id, name) => {
        setComplaints(prev => ({ ...prev, [id]: 0 }));
        showToast(t("dismissedToast", { name }));
      };

      // ═══════════════════════════════════════════════════════════
      // RENDER
      // ═══════════════════════════════════════════════════════════
      return (
        <div dir={dir} className={`min-h-screen ${dark ? "dark bg-black text-brand-50" : "bg-brand-50 text-stone-900"}`} style={{ fontFamily: lang === "ar" ? "'IBM Plex Sans Arabic', sans-serif" : "'IBM Plex Sans', sans-serif" }}>
          {/* Header */}
          <header className="sticky top-0 z-20 bg-black text-brand-50 px-3 pt-1.5 pb-1.5 rounded-b-xl shadow-lg border-b border-brand-900">
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-brand-800 flex items-center justify-center shadow-lg overflow-hidden border border-brand-700">
                  <img src="./icon-192.png" alt="Pharis" className="w-10 h-10" width="40" height="40" />
                </div>
                <div>
                  <h1 className="text-xl font-bold tracking-tight text-brand-400 leading-tight" dir="ltr">Pharis</h1>
                  <p className="text-[11px] text-brand-300">{typeof currentPlace === "string" ? currentPlace : (currentPlace && (currentPlace.name || currentPlace.country) ? [currentPlace.name, currentPlace.country].filter(Boolean).join(" · ") : "")}</p>
                  {adminUser && userCount != null && (
                    <p className="text-[10px] text-brand-400/80 mt-0.5 flex items-center gap-1">
                      <span aria-hidden="true">👥</span>
                      <span>
                        {userCount.toLocaleString(lang === "ar" ? "ar-DZ" : lang === "fr" ? "fr-FR" : "en-US")}
                        {" "}
                        {lang === "ar" ? "مستخدم" : lang === "fr" ? "utilisateurs" : "users"}
                      </span>
                    </p>
                  )}
                </div>
              </div>
              <div className="flex items-center gap-1.5">
                <button onClick={() => copyDownloaderCode()} className="p-1.5 rounded-lg hover:bg-brand-900 transition text-brand-300" title={lang === "ar" ? "نسخ كود Downloader" : lang === "fr" ? "Copier le code Downloader" : "Copy Downloader code"}>
                  <Icons.Download className="w-4 h-4" />
                </button>
                <button onClick={() => setDark(d => !d)} className="p-1.5 rounded-lg hover:bg-brand-900 transition" title={dark ? t("lightMode") : t("darkMode")}>

                      onChange={e => setForm(f => ({ ...f, activationCode: e.target.value.toUpperCase() }))}
                      placeholder={t("activationCodePlaceholder")}
                      dir="ltr"
                      className="w-full bg-white dark:bg-black border border-violet-200 dark:border-violet-700 rounded-xl px-3 py-2.5 text-sm font-mono outline-none focus:ring-2 focus:ring-violet-500"
                    />
                    <p className="text-[10px] text-violet-600 dark:text-violet-400 leading-relaxed">{t("activationHint")}</p>
                    {/* اشتراك مميز — مخفي مؤقتاً */}
                    {false && (
                    <>
                    <button type="button" onClick={() => setShowPayModal(true)} className="text-[11px] font-bold text-amber-700 dark:text-amber-300 underline block text-start">⭐ {t("upgradeFeatured")} — {lang === "ar" ? "ادفع بالبطاقة الذهبية" : lang === "fr" ? "Payer par Edahabia" : "Pay with Golden Card"}</button>
                    <a href="./pharmacy-owner.html" className="text-[10px] text-blue-600 dark:text-blue-300 underline block mt-1">{t("payPaypalForeign")}</a>
                    </>
                    )}
                  </div>

                  <button
                    onClick={submitNewPharmacy}
                    disabled={submitting || (!formLoc && !form.address.trim())}
                    className="w-full bg-brand-700 disabled:opacity-40 text-brand-50 rounded-xl py-3 text-sm font-semibold mt-1 hover:bg-brand-600 transition"
                  >
                    {submitting ? t("submittingPharmacy") : t("submitNewPharmacy")}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Login */}
          {showLogin && (
            <div className="fixed inset-0 bg-black/50 z-30 flex items-end" onClick={() => setShowLogin(false)}>
              <div className="bg-white dark:bg-brand-900 w-full rounded-t-3xl p-5 max-w-lg mx-auto animate-slide-up" onClick={e => e.stopPropagation()}>
                <div className="flex justify-between items-start">
                  <h2 className="text-xl font-bold">{t("adminLoginTitle")}</h2>
                  <button onClick={() => setShowLogin(false)} className="text-stone-400 p-1"><Icons.X className="w-5 h-5" /></button>
                </div>
                <div className="mt-4 space-y-3">
                  <input value={loginEmail} onChange={e => setLoginEmail(e.target.value)} dir="ltr" placeholder="admin@email.com" className="w-full bg-stone-50 dark:bg-black border border-stone-200 dark:border-brand-800 rounded-xl px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-brand-500" />
                  <input value={loginPassword} onChange={e => setLoginPassword(e.target.value)} type="password" dir="ltr" placeholder="••••••••" onKeyDown={e => e.key === "Enter" && submitLogin()} className="w-full bg-stone-50 dark:bg-black border border-stone-200 dark:border-brand-800 rounded-xl px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-brand-500" />
                  {loginError && <p className="text-xs text-rose-500">{loginError}</p>}
                  <button onClick={submitLogin} disabled={loginLoading} className="w-full bg-brand-700 disabled:opacity-60 text-brand-50 rounded-xl py-3 text-sm font-semibold">
                    {loginLoading ? "..." : t("loginBtn")}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Admin Panel */}
          {adminView && (
            <div className="fixed inset-0 bg-black z-40 overflow-y-auto">
              <div className="max-w-lg mx-auto px-4 py-6">
                <div className="flex items-center justify-between mb-1">
                  <h2 className="text-xl font-bold text-brand-50">{t("adminTitle")}</h2>
                  <div className="flex items-center gap-2">
                    <button onClick={() => { auth.signOut(); setAdminView(false); }} className="text-xs text-rose-300 border border-rose-900 rounded-md px-2 py-1">{t("logoutBtn")}</button>
                    <button onClick={() => setAdminView(false)} className="text-brand-400 p-1"><Icons.X className="w-5 h-5" /></button>
                  </div>
                </div>
                <p className="text-xs text-brand-500 mb-4 font-mono" dir="ltr">{adminUser?.email}</p>

                <div className="flex gap-2 mb-3">
                  <button onClick={() => setAdminTab("review")} className={`flex-1 text-xs font-medium rounded-lg py-2 ${adminTab === "review" ? "bg-brand-500 text-brand-950" : "bg-brand-900 text-brand-300"}`}>
                    {t("reviewBtn", { n: reviewQueue.length })}
                  </button>
                  <button onClick={() => setAdminTab("all")} className={`flex-1 text-xs font-medium rounded-lg py-2 ${adminTab === "all" ? "bg-brand-500 text-brand-950" : "bg-brand-900 text-brand-300"}`}>
                    {t("allPharmaciesTab", { n: allComputed.length })}
                  </button>
                  <button onClick={() => setAdminTab("admins")} className={`flex-1 text-xs font-medium rounded-lg py-2 ${adminTab === "admins" ? "bg-brand-500 text-brand-950" : "bg-brand-900 text-brand-300"}`}>
                    {t("adminTabAdmins")}
                  </button>
                </div>

                {(adminTab === "review" || adminTab === "all") && (
                  <div className="relative mb-4">
                    <span className="absolute top-1/2 -translate-y-1/2 start-3 text-brand-500 pointer-events-none">
                      <Icons.Search className="w-4 h-4" />
                    </span>
                    <input
                      value={adminSearch}
                      onChange={e => setAdminSearch(e.target.value)}
                      placeholder={t("adminSearchPh")}
                      className="w-full bg-brand-900 border border-brand-800 text-brand-50 placeholder-brand-600 rounded-xl py-2.5 pe-3 text-sm outline-none focus:ring-2 focus:ring-brand-500"
                      style={{ paddingInlineStart: "2.25rem" }}
                    />
                  </div>
                )}

                {adminTab === "review" && (
                  <>
                    <p className="text-sm text-brand-300 mb-4">{t("adminSubtitle", { n: COMPLAINT_THRESHOLD })}</p>
                    {reviewQueue.filter(ph => matchesSearch(ph, adminSearch)).length === 0 && <div className="text-center text-brand-600 mt-16 text-sm">{adminSearch.trim() ? t("adminSearchNoResults") : t("adminEmpty")}</div>}
                    <div className="space-y-3">
                      {reviewQueue.filter(ph => matchesSearch(ph, adminSearch)).map(ph => (
                        <div key={ph.id} className="bg-brand-900 rounded-2xl p-4 border border-brand-800">
                          <div className="flex items-start justify-between">
                            <div>
                              <h3 className="font-semibold text-brand-50">{ph.name}</h3>
                              <p className="text-xs text-brand-300 mt-0.5">{ph.area}</p>
                            </div>
                            <div className="flex items-center gap-1 bg-rose-950 text-rose-300 text-xs font-semibold px-2.5 py-1 rounded-full">
                              <Icons.Alert className="w-3 h-3" />{ph.complaintCount}
                            </div>
                          </div>
                          <div className="flex gap-2 mt-4">
                            <button onClick={() => dismissComplaints(ph.id, ph.name)} className="flex-1 bg-brand-800 text-brand-300 text-sm font-medium rounded-lg py-2.5">{t("verifyReturn")}</button>
                            <button onClick={() => removePermanently(ph.id, ph.name, ph)} className="flex-1 bg-rose-950 text-rose-300 text-sm font-medium rounded-lg py-2.5">{t("deleteFinal")}</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </>
                )}

                {adminTab === "all" && (
                  <>
                    <p className="text-sm text-brand-300 mb-4">{t("allPharmaciesSubtitle")}</p>
                    <div className="space-y-2">
                      {allComputed.filter(ph => matchesSearch(ph, adminSearch)).map(ph => (
                        <div key={ph.id} className="bg-brand-900 rounded-xl p-3 border border-brand-800 flex items-center justify-between gap-2">
                          <div className="min-w-0">
                            <p className="text-sm font-medium text-brand-50 truncate">{ph.name}</p>
                            <p className="text-xs text-brand-400 truncate">{ph.area}</p>
                          </div>
                          <button onClick={() => removePermanently(ph.id, ph.name, ph)} className="flex-shrink-0 bg-rose-950 text-rose-300 text-xs font-medium rounded-lg px-3 py-2">{t("deleteFinal")}</button>
                        </div>
                      ))}
                      {adminSearch.trim() && allComputed.filter(ph => matchesSearch(ph, adminSearch)).length === 0 && (
                        <div className="text-center text-brand-600 py-10 text-sm">{t("adminSearchNoResults")}</div>
                      )}
                    </div>
                  </>
                )}

                {adminTab === "admins" && (
                  <div className="space-y-4">
                    <div className="bg-brand-900 rounded-2xl p-4 border border-brand-800 space-y-3">
                      <h3 className="font-semibold text-brand-50 text-sm">{t("addAdminTitle")}</h3>
                      <p className="text-[11px] text-brand-400 leading-relaxed">
                        {lang === "ar"
                          ? "1) أنشئ حساباً للشخص من Firebase Authentication (Email/Password) أو اطلب منه التسجيل مرة. 2) انسخ User UID من Authentication → Users. 3) الصقه هنا."
                          : lang === "fr"
                          ? "1) Créez un compte dans Firebase Authentication. 2) Copiez le User UID. 3) Collez-le ici."
                          : "1) Create an account in Firebase Authentication. 2) Copy the User UID. 3) Paste it here."}
                      </p>
                      <input value={newAdminUid} onChange={e => setNewAdminUid(e.target.value)} dir="ltr" placeholder={t("addAdminUid")} className="w-full bg-black border border-brand-800 rounded-xl px-3 py-2.5 text-sm text-brand-50 font-mono outline-none focus:ring-2 focus:ring-brand-500" />
                      <input value={newAdminEmail} onChange={e => setNewAdminEmail(e.target.value)} dir="ltr" placeholder={t("addAdminEmail")} className="w-full bg-black border border-brand-800 rounded-xl px-3 py-2.5 text-sm text-brand-50 outline-none focus:ring-2 focus:ring-brand-500" />
                      <button onClick={addAdminAccount} className="w-full bg-brand-500 text-brand-950 font-bold rounded-xl py-2.5 text-sm">{t("addAdminBtn")}</button>
                      {adminMgmtMsg && <p className="text-xs text-emerald-400">{adminMgmtMsg}</p>}
                    </div>
                    <div className="space-y-2">
                      {(adminList.length ? adminList : [{ id: PRIMARY_ADMIN_UID, email: adminUser?.email, primary: true }]).map(a => (
                        <div key={a.id} className="bg-brand-900 rounded-xl p-3 border border-brand-800 flex items-center justify-between gap-2">
                          <div className="min-w-0">
                            <p className="text-xs text-brand-50 font-mono truncate" dir="ltr">{a.id}</p>
                            <p className="text-[11px] text-brand-400 truncate" dir="ltr">{a.email || "—"} {a.primary || a.id === PRIMARY_ADMIN_UID ? "· primary" : ""}</p>
                          </div>
                          {a.id !== PRIMARY_ADMIN_UID && (
                            <button onClick={() => removeAdminAccount(a.id)} className="text-xs text-rose-300 border border-rose-900 rounded-lg px-2 py-1 flex-shrink-0">
                              {lang === "ar" ? "حذف" : lang === "fr" ? "Retirer" : "Remove"}
                            </button>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    // Error Boundary
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      render() {
        if (this.state.hasError) {
          return (
            <div style={{ padding: 24, fontFamily: "sans-serif", color: "#7f1d1d", background: "#fef2f2", direction: "rtl", textAlign: "right", minHeight: "100vh" }}>
              <h2 style={{ marginBottom: 12 }}>⚠️ حدث خطأ غير متوقع</h2>
              <p style={{ fontSize: 14, color: "#666", marginBottom: 16 }}>جرب تحديث الصفحة.</p>
              {this.state.error && (
                <pre style={{ fontSize: 11, color: "#991b1b", whiteSpace: "pre-wrap", marginBottom: 12, textAlign: "left", direction: "ltr" }}>
                  {String(this.state.error && (this.state.error.message || this.state.error))}
                </pre>
              )}
              <button onClick={() => window.location.reload()} style={{ background: "#059669", color: "white", border: "none", padding: "10px 20px", borderRadius: 8, cursor: "pointer" }}>
                🔄 تحديث الصفحة
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById("root")).render(
      <ErrorBoundary>
        <PharisApp />
      </ErrorBoundary>
    );
    // الافتتاحية تُغلق نفسها بعد الفيديو — لا إغلاق مبكر من React

  </script>
  <script>
    // ═══════════════════════════════════════════════════════════
    // نظام التحديث — يظهر الزر عند وجود نسخة جديدة (بدون إعادة تحميل تلقائية)
    if ("serviceWorker" in navigator) {
      let refreshing = false;
      let pendingWorker = null;

      function pharisUpdateLang() {
        var lang = "ar";
        try {
          var saved = localStorage.getItem("pharis_lang");
          if (saved && ["ar", "fr", "en"].indexOf(saved) >= 0) lang = saved;
          else {
            var b = (navigator.language || "ar").slice(0, 2).toLowerCase();
            if (b === "fr" || b === "en") lang = b;
          }
        } catch (e) {}
        return lang;
      }
      function pharisUpdateLabels() {
        var lang = pharisUpdateLang();
        var map = {
          ar: { text: "تحديث جديد", applying: "جاري التحديث..." },
          fr: { text: "Nouvelle mise à jour", applying: "Mise à jour..." },
          en: { text: "New update", applying: "Updating..." }
        };
        return map[lang] || map.ar;
      }
      function showUpdateButton(worker) {
        if (worker) pendingWorker = worker;
        if (document.getElementById("pharis-update-btn")) return;
        var labels = pharisUpdateLabels();
        var lang = pharisUpdateLang();
        var dir = lang === "ar" ? "rtl" : "ltr";
        var ub = document.createElement("button");
        ub.id = "pharis-update-btn";
        ub.type = "button";
        ub.setAttribute("dir", dir);
        ub.setAttribute("aria-label", labels.text);
        ub.innerHTML = "🔄 " + labels.text;
        ub.onclick = function () {
          var L = pharisUpdateLabels();
          ub.disabled = true;
          ub.innerHTML = "⏳ " + L.applying;
          applyUpdate(pendingWorker);
        };
        ub.style.cssText = "position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:99998;border:none;border-radius:999px;padding:12px 20px;background:#065f46;color:#ecfdf5;font-size:14px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,0.35);cursor:pointer;font-family:system-ui,-apple-system,sans-serif;white-space:nowrap";
        document.body.appendChild(ub);
      }
      function applyUpdate(worker) {
        if (worker) {
          try { worker.postMessage({ type: "SKIP_WAITING" }); } catch (e) {}
        }
        try {
          navigator.serviceWorker.getRegistration().then(function (reg) {
            if (reg && reg.waiting) {
              try { reg.waiting.postMessage({ type: "SKIP_WAITING" }); } catch (e) {}
            }
          });
        } catch (e) {}
        setTimeout(function () {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        }, 500);
      }

      // بعد الضغط على الزر فقط: أعد التحميل عند تغيّر الـ controller
      navigator.serviceWorker.addEventListener("controllerchange", function () {
        if (!refreshing) return;
        window.location.reload();
      });

      // عند وصول نسخة جديدة من الـ SW: أظهر الزر (لا تعِد التحميل تلقائياً)
      navigator.serviceWorker.addEventListener("message", function (event) {
        if (event.data && event.data.type === "SW_UPDATED") {
          showUpdateButton(null);
        }
      });

      window.addEventListener("load", function () {
        navigator.serviceWorker
          .register("./service-worker.js", { updateViaCache: "none" })
          .then(function (reg) {
            if (reg.waiting) showUpdateButton(reg.waiting);

            reg.addEventListener("updatefound", function () {
              const newWorker = reg.installing;
              if (!newWorker) return;
              newWorker.addEventListener("statechange", function () {
                if (newWorker.state === "installed") {
                  showUpdateButton(newWorker);
                }
              });
            });

            // فحص دوري سريع
            setInterval(function () { reg.update().catch(function () {}); }, 5 * 1000);
            document.addEventListener("visibilitychange", function () {
              if (document.visibilityState === "visible") reg.update().catch(function () {});
            });
            window.addEventListener("focus", function () {
              reg.update().catch(function () {});
            });
          })
          .catch(function (err) {
            console.warn("SW registration failed:", err);
          });
      });
    }

    function showUpdateBanner(worker) {
      if (document.getElementById("pharis-update-banner")) return;

      let lang = "ar";
      try {
        const saved = localStorage.getItem("pharis_lang");
        if (saved && ["ar", "fr", "en"].includes(saved)) lang = saved;
        else {
          const b = (navigator.language || "ar").slice(0, 2).toLowerCase();
          if (b === "fr" || b === "en") lang = b;
        }
      } catch (e) {}

      const msg = {
        ar: { text: "🔄 يوجد تحديث جديد للتطبيق", btn: "تحديث الآن" },
        fr: { text: "🔄 Une nouvelle mise à jour est disponible", btn: "Mettre à jour" },
        en: { text: "🔄 A new app update is available", btn: "Update now" }
      }[lang] || { text: "🔄 يوجد تحديث جديد للتطبيق", btn: "تحديث الآن" };
      const dir = lang === "ar" ? "rtl" : "ltr";
      const font = lang === "ar"
        ? "'IBM Plex Sans Arabic', system-ui, sans-serif"
        : "system-ui, -apple-system, sans-serif";

      const banner = document.createElement("div");
      banner.id = "pharis-update-banner";
      banner.innerHTML = `
        <div style="
          position: fixed;
          bottom: 24px;
          left: 50%;
          transform: translateX(-50%);
          z-index: 99999;
          background: #064e3b;
          color: white;
          padding: 14px 18px;
          border-radius: 14px;
          box-shadow: 0 10px 30px rgba(0,0,0,0.35);
          display: flex;
          align-items: center;
          gap: 14px;
          font-size: 15px;
          border: 1px solid #047857;
          min-width: 280px;
          font-family: ${font};
          direction: ${dir};
          animation: pharisSlideUp 0.35s ease;
        ">
          <span style="flex:1">${msg.text}</span>
          <button type="button" id="pharis-update-btn" style="
            background: #10b981;
            color: #022c22;
            border: none;
            padding: 8px 16px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            pointer-events: auto;
          ">${msg.btn}</button>
          <button type="button" id="pharis-close-update-btn" style="
            background: transparent;
            color: #6ee7b7;
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 0 4px;
            line-height: 1;
            pointer-events: auto;
          ">✕</button>
        </div>
        <style>
          @keyframes pharisSlideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(30px); }
            to   { opacity: 1; transform: translateX(-50%) translateY(0); }
          }
        </style>
      `;

      document.body.appendChild(banner);

      const doUpdate = function () {
        const btn = document.getElementById("pharis-update-btn");
        if (btn) {
          btn.disabled = true;
          btn.textContent = lang === "fr" ? "..." : lang === "en" ? "..." : "...";
        }
        // 1) أخبر الـ SW بالتخطي
        try {
          if (worker) worker.postMessage({ type: "SKIP_WAITING" });
        } catch (e) {}
        try {
          if (navigator.serviceWorker.controller) {
            navigator.serviceWorker.controller.postMessage({ type: "SKIP_WAITING" });
            navigator.serviceWorker.controller.postMessage({ type: "CLEAR_CACHE" });
          }
        } catch (e) {}
        // 2) امسح الكاش من الصفحة
        if (window.caches && caches.keys) {
          caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }).catch(function () {}).finally(function () {
            window.location.reload();
          });
        } else {
          window.location.reload();
        }
        // أمان: إعادة تحميل بعد ثانيتين حتى لو علق الكاش
        setTimeout(function () { window.location.reload(); }, 2000);
      };

      document.getElementById("pharis-update-btn").addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        doUpdate();
      });

      document.getElementById("pharis-close-update-btn").addEventListener("click", function (e) {
        e.preventDefault();
        banner.remove();
      });
    }

    // PWA Install Prompt
    window.__pharisInstallPrompt = null;
    window.addEventListener("beforeinstallprompt", function (e) {
      e.preventDefault();
      window.__pharisInstallPrompt = e;
      window.dispatchEvent(new Event("pharis-installable"));
    });
  </script>
