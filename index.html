<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  
  <title>Pharis</title>
  
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon.svg" />

  <script src="https://cdn.tailwindcss.com"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.6/babel.min.js"></script>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: white;
      overflow-x: hidden;
    }
    #root {
      min-height: 100vh;
    }
    #update-banner {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99999;
      animation: slideUp 0.35s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateX(-50%) translateY(30px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    if ("serviceWorker" in navigator) {
      let refreshing = false;

      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });

      navigator.serviceWorker
        .register("./service-worker.js")
        .then((reg) => {
          setInterval(() => reg.update(), 60 * 1000);

          reg.addEventListener("updatefound", () => {
            const newWorker = reg.installing;
            if (!newWorker) return;

            newWorker.addEventListener("statechange", () => {
              if (
                newWorker.state === "installed" &&
                navigator.serviceWorker.controller
              ) {
                showUpdateBanner(newWorker);
              }
            });
          });
        })
        .catch((err) => console.error("SW registration failed:", err));
    }

    function showUpdateBanner(worker) {
      if (document.getElementById("update-banner")) return;

      const banner = document.createElement("div");
      banner.id = "update-banner";
      banner.innerHTML = `
        <div style="
          background: #1e293b;
          color: white;
          padding: 14px 18px;
          border-radius: 14px;
          box-shadow: 0 10px 30px rgba(0,0,0,0.35);
          display: flex;
          align-items: center;
          gap: 14px;
          font-size: 15px;
          border: 1px solid #334155;
          min-width: 280px;
        ">
          <span style="flex:1">🔄 يوجد تحديث جديد للتطبيق</span>
          <button id="update-btn" style="
            background: #3b82f6;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
          ">تحديث الآن</button>
          <button id="close-update-btn" style="
            background: transparent;
            color: #94a3b8;
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 0 4px;
            line-height: 1;
          ">✕</button>
        </div>
      `;

      document.body.appendChild(banner);

      document.getElementById("update-btn").onclick = () => {
        worker.postMessage({ type: "SKIP_WAITING" });
      };

      document.getElementById("close-update-btn").onclick = () => {
        banner.remove();
      };
    }
  </script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      return (
        <div className="min-h-screen bg-slate-900 text-white flex flex-col items-center justify-center p-6">
          <div className="text-center space-y-4">
            <div className="text-5xl">🗺️</div>
            <h1 className="text-3xl font-bold">Pharis</h1>
            <p className="text-slate-400 text-lg">التطبيق جاهز للعمل</p>
            <p className="text-slate-500 text-sm mt-8">
              تم تفعيل نظام التحديث التلقائي
            </p>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
