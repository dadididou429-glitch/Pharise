      if (ph.onDuty) return { open: true, kind: "onDuty" };
      const hour = now.getHours() + now.getMinutes() / 60;
      const { open, close } = ph.hours || { open: 8, close: 21 };
      const isOpen = close > 24 ? (hour >= open || hour < close - 24) : (hour >= open && hour < close);
      return { open: isOpen, kind: isOpen ? "closesAt" : "opensAt", time: isOpen ? close % 24 : open };
    }

    function fmtHour(h) {
      const hh = Math.floor(h) % 24;
      const mm = Math.round((h - Math.floor(h)) * 60);
      return String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0");
    }

    function haversine(lat1, lng1, lat2, lng2) {
      const R = 6371;
      const dLat = ((lat2 - lat1) * Math.PI) / 180;
      const dLng = ((lng2 - lng1) * Math.PI) / 180;
      const a = Math.sin(dLat / 2) ** 2 + Math.cos((lat1 * Math.PI) / 180) * Math.cos((lat2 * Math.PI) / 180) * Math.sin(dLng / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function sanitize(text, max = 100) {
      if (!text || typeof text !== "string") return null;
      const cleaned = text.trim().replace(/[<>\x00-\x1F\x7F]/g, "").substring(0, max);
      return cleaned.length > 0 ? cleaned : null;
    }

    function isValidPhone(phone) {
      if (!phone) return true;
      return /^[+\d\s\-()]{6,20}$/.test(phone.trim());
    }

    // ═══════════════════════════════════════════════════════════
    // API HELPERS
    // ═══════════════════════════════════════════════════════════
    async function searchCities(query, countryCode) {
      if (!query.trim()) return [];
      const cc = countryCode === "OTHER" ? "" : countryCode;
      const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query + (cc ? ", " + cc : ""))}&format=json&addressdetails=1&limit=8&accept-language=ar,en,fr`;
      const res = await fetch(url, { headers: { "Accept-Language": "ar,en,fr" } });
      const data = await res.json();
      return data
        .filter(item => ["city", "town", "village", "municipality"].includes(item.type) || item.class === "place")
        .map(item => ({
          name: item.display_name.split(",")[0],
          fullName: item.display_name,
          lat: parseFloat(item.lat),
          lng: parseFloat(item.lon),
          country: item.address?.country || ""
        }));
    }

    async function geocodeAddress(address, countryHint) {
      const q = countryHint ? `${address}, ${countryHint}` : address;
      const res = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1&addressdetails=1`);
      const data = await res.json();
      if (!data.length) throw new Error("Address not found");
      return {
        lat: parseFloat(data[0].lat),
        lng: parseFloat(data[0].lon),
        displayName: data[0].display_name,
        city: data[0].address?.city || data[0].address?.town || data[0].address?.village || "",
        countryCode: (data[0].address?.country_code || "").toUpperCase()
      };
    }

    const OVERPASS_ENDPOINTS = [
      "https://overpass-api.de/api/interpreter",
      "https://overpass.kumi.systems/api/interpreter",
      "https://overpass.nchc.org.tw/api/interpreter",
    ];

    function parseOpeningHours(oh) {
      if (!oh) return { open: 8, close: 21, onDuty: false };
      const s = String(oh).toLowerCase().replace(/\s/g, "");
      if (s.includes("24/7") || s === "24hours" || s.includes("mo-su00:00-24:00")) {
        return { open: 0, close: 24, onDuty: true };
      }
      // Try to extract first time range like 08:00-22:00
      const m = oh.match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);
      if (m) {
        const open = parseInt(m[1], 10) + parseInt(m[2], 10) / 60;
        let close = parseInt(m[3], 10) + parseInt(m[4], 10) / 60;
        if (close <= open) close += 24;
        return { open, close, onDuty: false };
      }
      return { open: 8, close: 21, onDuty: false };
    }

    function mapOSMElement(el, idx, defaultCity = "") {
      const t = el.tags || {};
      // Ways have center from "out center"
      const lat = el.lat || el.center?.lat;
      const lng = el.lon || el.center?.lon;
      if (!lat || !lng) return null;

      const rawName = t["name:ar"] || t["name:fr"] || t.name || t["brand"] || "";
      const name = rawName
        ? (/صيدلية|pharmacie|pharmacy|صيدليه/i.test(rawName) ? rawName : `صيدلية ${rawName}`)
        : (defaultCity ? `صيدلية ${defaultCity}` : "صيدلية");

      const hours = parseOpeningHours(t.opening_hours);
      const address = [
        t["addr:housenumber"],
        t["addr:street"] || t["addr:place"],
        t["addr:suburb"] || t["addr:quarter"],
        t["addr:city"]
      ].filter(Boolean).join(", ");

      return {
        id: `osm_${el.type || "n"}_${el.id}`,
        name,
        area: t["addr:suburb"] || t["addr:city"] || t["addr:district"] || t["addr:municipality"] || defaultCity,
        address: address || defaultCity,
        phone: t.phone || t["contact:phone"] || t["contact:mobile"] || t.mobile || null,
        lat,
        lng,
        hours: { open: hours.open, close: hours.close },
        onDuty: hours.onDuty,
        wilaya: defaultCity || "OSM",
        commune: t["addr:city"] || defaultCity,
        verified: true,
        fromOSM: true,
        openingHoursRaw: t.opening_hours || null
      };
    }

    function dedupePharmacies(list) {
      const seen = new Set();
      return list.filter(p => {
        if (!p) return false;
        // Dedupe by rounded coords + name
        const key = `${p.lat.toFixed(4)}_${p.lng.toFixed(4)}_${(p.name || "").slice(0, 20)}`;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    function getOSMCache(key) {
      try {
        const raw = localStorage.getItem("pharis_osm_" + key);
        if (!raw) return null;
        const { ts, data } = JSON.parse(raw);
        if (Date.now() - ts > 3 * 60 * 60 * 1000) return null; // 3h
        return data;
      } catch { return null; }
    }
    function setOSMCache(key, data) {
      try {
        localStorage.setItem("pharis_osm_" + key, JSON.stringify({ ts: Date.now(), data }));
      } catch {}
    }

    async function overpassFetch(query) {
      let lastErr;
      for (const endpoint of OVERPASS_ENDPOINTS) {
        try {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 22000);
          const res = await fetch(endpoint, {
            method: "POST",
            body: "data=" + encodeURIComponent(query),
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            signal: controller.signal
          });
          clearTimeout(timer);
          if (!res.ok) throw new Error("HTTP " + res.status);
          const data = await res.json();
          if (!data.elements) throw new Error("Invalid response");
          return data;
        } catch (e) {
          lastErr = e;
        }
      }
      throw lastErr || new Error("All Overpass endpoints failed");
    }

    // Core: fetch real pharmacies around a point (nodes + ways)
    async function fetchOSMPharmacies(lat, lng, radius = 15000) {
      const cacheKey = `near_${lat.toFixed(3)}_${lng.toFixed(3)}_${radius}`;
      const cached = getOSMCache(cacheKey);
      if (cached && cached.length > 0) return cached;

      // Query both nodes and ways, with center for buildings
      const query = `[out:json][timeout:20];
(
  node["amenity"="pharmacy"](around:${radius},${lat},${lng});
  way["amenity"="pharmacy"](around:${radius},${lat},${lng});
  node["healthcare"="pharmacy"](around:${radius},${lat},${lng});
  way["healthcare"="pharmacy"](around:${radius},${lat},${lng});
  node["shop"="pharmacy"](around:${radius},${lat},${lng});
);
out center tags;`;

      const data = await overpassFetch(query);
      const result = dedupePharmacies(
        (data.elements || []).map((el, idx) => mapOSMElement(el, idx))
      );
      if (result.length > 0) setOSMCache(cacheKey, result);
      return result;
    }

    // Fetch by city name — uses coordinates when available (fast path)
    async function fetchOSMByCity(cityName, lat, lng) {
      const cacheKey = "city_" + String(cityName).toLowerCase().replace(/\s+/g, "_").slice(0, 50);
      const cached = getOSMCache(cacheKey);
      if (cached && cached.length > 0) return cached;

      let cityLat = lat;
      let cityLng = lng;
      let displayCity = cityName;

      if (!cityLat || !cityLng) {
        const geoRes = await fetch(
          `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(cityName)}&format=json&limit=1`,
          { headers: { "Accept-Language": "ar,en,fr" } }
        );
        const geoData = await geoRes.json();
        if (!geoData.length) throw new Error("City not found");
        cityLat = parseFloat(geoData[0].lat);
        cityLng = parseFloat(geoData[0].lon);
        displayCity = geoData[0].display_name.split(",")[0];
      }

      // Try increasing radius if few results (city centers vs suburbs)
      let result = [];
      for (const radius of [12000, 20000, 30000]) {
        result = await fetchOSMPharmacies(cityLat, cityLng, radius);
        if (result.length >= 5) break;
      }

      const tagged = result.map(p => ({
        ...p,
        wilaya: displayCity,
        commune: p.commune || displayCity,
        area: p.area || displayCity
      }));
      if (tagged.length > 0) setOSMCache(cacheKey, tagged);
      return tagged;
    }

        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {

        L.circleMarker([userLoc.lat, userLoc.lng], {

        }).addTo(map).bindPopup(lang === "ar" ? "📍 أنت هنا" : lang === "fr" ? "📍 Vous êtes ici" : "📍 You are here");

        const markers = [];
        pharmacies.forEach(ph => {

            radius: 11, fillColor: color, color: "#fff", weight: 2, fillOpacity: 0.9

          m.bindPopup(`<div style="font-family:sans-serif;text-align:${lang==="ar"?"right":"left"};direction:${lang==="ar"?"rtl":"ltr"};min-width:180px;padding:2px">

          </div>`);
          m.on("click", () => onSelect && onSelect(ph));
          markers.push(m);
        });

        if (markers.length) {
          const group = L.featureGroup(markers);
          map.fitBounds(group.getBounds().pad(0.12));
        }
        mapInstance.current = map;
        return () => {
          map.remove();
          mapInstance.current = null;
        };
      }, []);

      return <div ref={mapRef} className="w-full h-full min-h-[50vh] rounded-2xl" />;
    }

      const list = useMemo(() => {
        return allComputed
          .filter(ph => (ph.name + " " + (ph.area || "") + " " + (ph.address || "")).toLowerCase().includes(query.toLowerCase()))
          .filter(ph => filter === "open" ? ph.status.open : true)
          .filter(ph => filter === "urgent" ? ph.onDuty : true)
          .filter(ph => filter === "favorites" ? ph.isFavorite : true)
          .filter(ph => filter === "late" ? (ph.status.open && (ph.hours?.close > 22 || ph.onDuty)) : true)
          .sort((a, b) => a.distance - b.distance);
      }, [allComputed, query, filter]);

      const openCount = list.filter(p => p.status.open).length;

      // Emergency: top open pharmacies by distance (max 8)
      const emergencyList = useMemo(() => {
        return allComputed
          .filter(ph => ph.status.open)
          .sort((a, b) => {
            // 24h first, then by distance
            if (a.onDuty !== b.onDuty) return a.onDuty ? -1 : 1;
            return a.distance - b.distance;
          })
          .slice(0, 8);
      }, [allComputed]);

      const reviewQueue = useMemo(() => {
        return RAW
          .filter(ph => !removedIds.has(ph.id))
          .map(ph => ({ ...ph, complaintCount: complaints[ph.id] || 0 }))
          .filter(ph => ph.complaintCount >= COMPLAINT_THRESHOLD)
          .sort((a, b) => b.complaintCount - a.complaintCount);
      }, [complaints, removedIds]);

      const selectedLive = selected ? allComputed.find(p => p.id === selected.id) || selected : null;
      const timeStr = now.toLocaleTimeString(lang === "ar" ? "ar-DZ" : lang === "fr" ? "fr-FR" : "en-GB", { hour: "2-digit", minute: "2-digit" });

      // Actions
      const showToast = (msg) => setToast(msg);

      const toggleFavorite = (id, name) => {
        setFavorites(prev => {
          const next = new Set(prev);
          if (next.has(id)) {
            next.delete(id);
            showToast(t("removedFavorite", { name }));
          } else {
            next.add(id);
            showToast(t("addedFavorite", { name }));
          }
          try { localStorage.setItem("pharis_favorites", JSON.stringify([...next])); } catch {}
          return next;
        });
      };

      const confirmStatus = (id, isOpen) => {
        setStatusConfirms(prev => {
          const cur = prev[id] || { open: 0, closed: 0 };
          const next = {
            ...prev,
            [id]: isOpen
              ? { open: cur.open + 1, closed: cur.closed }
              : { open: cur.open, closed: cur.closed + 1 }
          };
          try { localStorage.setItem("pharis_confirms", JSON.stringify(next)); } catch {}
          return next;
        });
        showToast(t("thanksConfirm"));
      };

      const reportPharmacy = (id, name) => {
        if (reportedByMe.has(id)) {
          showToast(t("alreadyReported"));
          return;
        }
        setComplaints(prev => {
          const next = { ...prev, [id]: (prev[id] || 0) + 1 };
          showToast(next[id] === COMPLAINT_THRESHOLD ? t("thresholdReached", { n: COMPLAINT_THRESHOLD, name }) : t("thanksReport"));
          return next;
        });
        setReportedByMe(prev => new Set(prev).add(id));
      };

      const submitRating = (id) => {
        if (draftStars === 0) {
          showToast(t("pickStarsFirst"));
          return;
        }
        setRatings(prev => {
          const cur = prev[id] || { sum: 0, count: 0 };
          const already = myReviews[id];
          const sum = already ? cur.sum - already.stars + draftStars : cur.sum + draftStars;
          const count = already ? cur.count : cur.count + 1;
          return { ...prev, [id]: { sum, count } };
        });
        setMyReviews(prev => ({ ...prev, [id]: { stars: draftStars, text: draftText } }));
        showToast(t("reviewSubmitted"));
      };

      const loadOSMNearMe = async () => {
        setLoadingOSM(true);
        showToast(lang === "ar" ? "⏳ جاري البحث عن صيدليات قريبة..." : lang === "fr" ? "⏳ Recherche de pharmacies proches..." : "⏳ Searching nearby pharmacies...");
        try {
          let data = await fetchOSMPharmacies(userLoc.lat, userLoc.lng, 15000);
          if (data.length < 3) {
            data = await fetchOSMPharmacies(userLoc.lat, userLoc.lng, 30000);
          }
          setOsmPharmacies(data);
          setWilayaId(999);
          setCurrentPlace(lang === "ar" ? "قريب منك" : lang === "fr" ? "Près de vous" : "Near you");
          if (data.length === 0) {
            showToast(lang === "ar" ? "⚠️ لا توجد صيدليات قريبة في بيانات الخريطة" : lang === "fr" ? "⚠️ Aucune pharmacie proche" : "⚠️ No nearby pharmacies");
          } else {
            showToast(t("pharmaciesFound", { n: data.length, name: lang === "ar" ? "قربك" : "nearby" }));
          }
        } catch (err) {
          console.error("OSM near error:", err);
          showToast(t("loadFailed"));
        } finally {
          setLoadingOSM(false);
        }
      };

      const selectCountry = (c) => {
        setCountryId(c.id);
        setCitySearch("");
        setCityResults([]);
        setShowCityList(true);
        // For Algeria, don't clear pharmacies yet — wait for city/wilaya
        if (c.id !== "DZ") {
          setOsmPharmacies([]);
          setWilayaId(999);
        }
      };

      const searchCityAndLoad = async () => {
        if (!citySearch.trim()) return;
        setLoadingCities(true);
        try {
          const results = await searchCities(citySearch, countryId);
          setCityResults(results);
          setShowCityList(true);
        } catch {
          setCityResults([]);
        } finally {
          setLoadingCities(false);
        }
      };

      const selectCity = async (city) => {
        setCityResults([]);
        setShowCityList(false);
        setCitySearch(city.name);
        setUserLoc({ lat: city.lat, lng: city.lng });
        setCurrentPlace(city.name);

        // Algeria with local data
        if (countryId === "DZ" && city.wilayaId) {
          setWilayaId(city.wilayaId);
          setOsmPharmacies([]);
          setShowLocationPicker(false);
          const count = RAW.filter(p => p.wilaya === city.name).length;
          showToast(t("pharmaciesFound", { n: count, name: city.name }));
          return;
        }

        // Real pharmacies from OpenStreetMap
        setLoadingOSM(true);
        showToast(lang === "ar" ? `⏳ جاري جلب صيدليات ${city.name}...` : lang === "fr" ? `⏳ Chargement des pharmacies de ${city.name}...` : `⏳ Loading pharmacies in ${city.name}...`);
        try {
          const countryName = COUNTRIES.find(c => c.id === countryId);
          const q = city.nameEn
            ? `${city.nameEn}, ${countryName?.nameEn || countryId}`
            : `${city.name}${countryName ? ", " + (countryName.nameEn || countryName.name) : ""}`;
          const data = await fetchOSMByCity(q, city.lat, city.lng);
          setOsmPharmacies(data);
          setWilayaId(999);
          if (data.length === 0) {
            showToast(lang === "ar" ? `⚠️ لم نجد صيدليات في ${city.name} على الخريطة` : lang === "fr" ? `⚠️ Aucune pharmacie trouvée à ${city.name}` : `⚠️ No pharmacies found in ${city.name}`);
          } else {
            showToast(t("pharmaciesFound", { n: data.length, name: city.name }));
          }
        } catch (err) {
          console.error("OSM fetch error:", err);
          showToast(t("loadFailed"));
        } finally {
          setLoadingOSM(false);
          setShowLocationPicker(false);
        }
      };

      const selectWilaya = (w) => {
        if (!w.enabled) return;
        setWilayaId(w.id);
        setOsmPharmacies([]);
        setCurrentPlace(w.name);
        setShowLocationPicker(false);
      };

      // Filtered city suggestions for the selected country
      const countryCities = CITIES_BY_COUNTRY[countryId] || [];
      const filteredCities = citySearch.trim()
        ? countryCities.filter(c =>
            c.name.toLowerCase().includes(citySearch.toLowerCase()) ||
            (c.nameEn && c.nameEn.toLowerCase().includes(citySearch.toLowerCase()))
          )
        : countryCities;

      // Add pharmacy
      const captureFormLocation = () => {
        if (!navigator.geolocation) {
          setFormLocStatus("failed");
          return;
        }
        setFormLocStatus("loading");
        navigator.geolocation.getCurrentPosition(
          pos => {
            setFormLoc({ lat: pos.coords.latitude, lng: pos.coords.longitude });
            setFormLocStatus("ok");
          },
          () => setFormLocStatus("failed"),
          { timeout: 8000 }
        );
      };

      const submitNewPharmacy = async () => {
        const vName = sanitize(form.name, 80);
        const vAddress = sanitize(form.address, 200);
        const vArea = sanitize(form.area, 80);
        const vPhone = form.phone.trim() ? (isValidPhone(form.phone) ? form.phone.trim().substring(0, 20) : null) : null;

        if (!vName || !vAddress) {
          showToast(t("formRequiredError"));
          return;
        }
        if (form.phone.trim() && !vPhone) {
          showToast(t("invalidPhone"));
          return;
        }
        if (Date.now() - lastSubmit < 30000) {
          showToast(t("wait30s"));
          return;
        }

        setSubmitting(true);
        setLastSubmit(Date.now());
        let loc = formLoc;
        try {
          if (!loc && form.address.trim()) {
            const geo = await geocodeAddress(form.address, form.country === "DZ" ? "Algeria" : form.country);
            loc = { lat: geo.lat, lng: geo.lng };
          }
          if (!loc) loc = userLoc;

          const payload = {
            name: vName,
            area: vArea || form.city || "",
            address: vAddress,
            phone: vPhone,
            lat: loc.lat,
            lng: loc.lng,
            wilaya: form.country === "DZ" ? (WILAYAS.find(w => w.id === wilayaId)?.name || "سيدي بلعباس") : form.city || "🌍",
            commune: vArea || form.city || "",
            country: form.country,
            hours: { open: Number(form.open), close: Number(form.close) },
            onDuty: form.onDuty,
            verified: false,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          };

          const ref = await db.collection("pharmacies_submitted").add(payload);
          setSubmitted(prev => [...prev, { id: ref.id, ...payload }]);
          showToast(t("newPharmacySuccess"));
          setShowAddForm(false);
          setForm({ name: "", area: "", address: "", phone: "", open: 8, close: 21, onDuty: false, country: "DZ", city: "" });
          setFormLoc(null);
          setFormLocStatus(null);
        } catch {
          showToast(t("newPharmacyError"));
        } finally {
          setSubmitting(false);
        }
      };

      // Admin
      const submitLogin = async () => {
        setLoginError(null);
        setLoginLoading(true);
        try {
          await auth.signInWithEmailAndPassword(loginEmail.trim(), loginPassword);
          setShowLogin(false);
          setAdminView(true);
          setLoginPassword("");
        } catch {
          setLoginError(t("loginError"));
        } finally {
          setLoginLoading(false);
        }
      };

      const removePermanently = async (id, name) => {
        setRemovedIds(prev => new Set(prev).add(id));
        showToast(t("removedToast", { name }));
        try {
          if (typeof id === "string") {
            await db.collection("pharmacies_submitted").doc(id).delete();
            setSubmitted(prev => prev.filter(p => p.id !== id));
          } else {
            await db.collection("removed_pharmacies").doc(String(id)).set({
              name,
              removedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
          }
        } catch {}
      };

      const dismissComplaints = (id, name) => {
        setComplaints(prev => ({ ...prev, [id]: 0 }));
        showToast(t("dismissedToast", { name }));
      };

      // ═══════════════════════════════════════════════════════════
      // RENDER
      // ═══════════════════════════════════════════════════════════
      return (
        <div dir={dir} className={`min-h-screen ${dark ? "dark bg-brand-950 text-brand-50" : "bg-brand-50 text-stone-900"}`} style={{ fontFamily: lang === "ar" ? "'IBM Plex Sans Arabic', sans-serif" : "'IBM Plex Sans', sans-serif" }}>
          {/* Header */}
          <header className="sticky top-0 z-20 bg-brand-950 text-brand-50 px-4 pt-3 pb-4 rounded-b-2xl shadow-lg">
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <div className="w-8 h-8 rounded-lg bg-brand-700 flex items-center justify-center shadow-md">
                  <Icons.Cross className="w-4 h-4 text-brand-100" />
                </div>
                <div>
                  <h1 className="text-lg font-bold tracking-tight text-brand-400 leading-tight" dir="ltr">Pharis</h1>
                  <p className="text-[11px] text-brand-300">{currentPlace}</p>
                </div>
              </div>
              <div className="flex items-center gap-1.5">
                <button onClick={() => setDark(d => !d)} className="p-1.5 rounded-lg hover:bg-brand-900 transition" title={dark ? t("lightMode") : t("darkMode")}>
                  {dark ? <Icons.Sun className="w-4 h-4 text-brand-300" /> : <Icons.Moon className="w-4 h-4 text-brand-300" />}
                </button>
                <button onClick={() => adminUser ? setAdminView(true) : setShowLogin(true)} className="font-mono text-brand-400 text-[10px] border border-brand-800 rounded-md px-2 py-1 hover:bg-brand-900 transition">
                  {t("dashboard")}
                </button>
                <div className="font-mono text-brand-400 text-xs border border-brand-800 rounded-md px-2 py-1">{timeStr}</div>
              </div>
            </div>

            {/* Location button */}
            <button
              onClick={() => setShowLocationPicker(s => !s)}
              className={`mt-3 w-full flex items-center justify-between gap-2 rounded-xl px-3 py-2.5 border transition ${showLocationPicker ? "bg-brand-500 border-brand-400 text-brand-950" : "bg-brand-900 border-brand-700 text-brand-100 hover:bg-brand-800"}`}
            >
              <span className="flex items-center gap-2 text-sm font-medium">
                <Icons.MapPin className="w-4 h-4" />
                {t("tagline", { place: currentPlace })}
              </span>
              <span className={`text-xs font-semibold underline ${showLocationPicker ? "text-brand-950" : "text-brand-300"}`}>
                {t("changeLocation")}
              </span>
            </button>

            {/* Language */}
            <div className="flex gap-1.5 mt-2">
              {[{ code: "ar", label: "العربية" }, { code: "fr", label: "Français" }, { code: "en", label: "English" }].map(l => (
                <button
                  key={l.code}
                  onClick={() => setLang(l.code)}
                  className={`px-2.5 py-1 rounded-full text-xs font-medium transition ${lang === l.code ? "bg-brand-400 text-brand-950" : "bg-brand-900 text-brand-300"}`}
                >
                  {l.label}
                </button>
              ))}
            </div>

            {/* Location picker panel */}
            {showLocationPicker && (
              <div className="mt-3 bg-brand-950 rounded-2xl p-3 max-h-[60vh] overflow-y-auto border border-brand-800 space-y-3 scrollbar-thin animate-fade-in">
                {/* 1. Country — immediate change */}
                <div>
                  <p className="text-xs text-brand-300 px-1 pb-2 font-medium">{t("country")}</p>
                  <div className="grid grid-cols-2 gap-1">
                    {COUNTRIES.map(c => (
                      <button
                        key={c.id}
                        onClick={() => selectCountry(c)}
                        className={`text-start text-xs px-2.5 py-2 rounded-lg transition truncate ${c.id === countryId ? "bg-brand-500 text-brand-950 font-semibold shadow-sm" : "text-brand-200 hover:bg-brand-900"}`}
                      >
                        {lang === "ar" ? c.name : lang === "fr" ? c.nameFr : c.nameEn}
                      </button>
                    ))}
                  </div>
                </div>

                {/* 2. City — dropdown list for selected country */}
                <div className="pt-2 border-t border-brand-800">
                  <p className="text-xs text-brand-300 px-1 pb-2 font-medium">{t("city")}</p>

                  {/* Search / filter input */}
                  <div className="relative mb-2">
                    <input
                      value={citySearch}
                      onChange={e => { setCitySearch(e.target.value); setShowCityList(true); }}
                      onFocus={() => setShowCityList(true)}
                      onKeyDown={e => e.key === "Enter" && searchCityAndLoad()}
                      placeholder={lang === "ar" ? "ابحث أو اختر مدينة..." : lang === "fr" ? "Rechercher ou choisir une ville..." : "Search or choose a city..."}
                      className="w-full bg-brand-900 placeholder-brand-600 text-brand-50 rounded-xl px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-brand-500"
                    />
                    {loadingCities && <span className="absolute top-1/2 -translate-y-1/2 end-3 text-xs text-brand-400">…</span>}
                  </div>

                  {/* Predefined cities of the selected country */}
                  {showCityList && filteredCities.length > 0 && (
                    <div className="space-y-0.5 max-h-48 overflow-y-auto rounded-xl border border-brand-800 bg-brand-900/50 mb-2">
                      {filteredCities.map((city, i) => (
                        <button
                          key={i}
                          onClick={() => selectCity(city)}
                          className="w-full text-start text-sm px-3 py-2.5 text-brand-100 hover:bg-brand-700 transition flex items-center justify-between border-b border-brand-800/50 last:border-0"
                        >
                          <span className="font-medium">{lang === "en" && city.nameEn ? city.nameEn : city.name}</span>
                          {city.wilayaId && <span className="text-[10px] text-brand-400 bg-brand-800 px-1.5 py-0.5 rounded">محلي</span>}
                        </button>
                      ))}
                    </div>
                  )}

                  {/* Nominatim search results (extra cities) */}
                  {cityResults.length > 0 && (
                    <div className="space-y-0.5 max-h-36 overflow-y-auto rounded-xl border border-brand-700 bg-brand-900/80">
                      <p className="text-[10px] text-brand-500 px-3 pt-2 pb-1">{lang === "ar" ? "نتائج البحث" : lang === "fr" ? "Résultats" : "Search results"}</p>
                      {cityResults.map((city, i) => (
                        <button
                          key={i}
                          onClick={() => selectCity(city)}
                          className="w-full text-start text-xs px-3 py-2 text-brand-200 hover:bg-brand-800 transition flex items-center justify-between"
                        >
                          <span className="truncate">{city.name}</span>
                          <span className="text-[9px] text-brand-500 flex-shrink-0 ms-2">{city.country}</span>
                        </button>
                      ))}
                    </div>
                  )}

                  {/* Search button for free text */}
                  {citySearch.trim() && filteredCities.length === 0 && (
                    <button
                      onClick={searchCityAndLoad}
                      disabled={loadingCities}
                      className="w-full mt-1 py-2 rounded-xl text-xs font-semibold bg-brand-700 text-brand-50 disabled:opacity-50"
                    >
                      {loadingCities ? "…" : (lang === "ar" ? `🔍 بحث عن "${citySearch}"` : lang === "fr" ? `🔍 Chercher "${citySearch}"` : `🔍 Search "${citySearch}"`)}
                    </button>
                  )}
                </div>
              </div>
            )}

            {/* Stats */}
            <div className="mt-3 flex items-baseline gap-2">
              <span className="text-3xl font-bold font-mono text-brand-400">{openCount}</span>
              <span className="text-xs text-brand-200">{t("openStat", { total: list.length })}</span>
            </div>

            {/* Search */}
            <div className="mt-3 relative">
              <Icons.Search className={`absolute top-1/2 -translate-y-1/2 w-4 h-4 text-brand-500 ${dir === "rtl" ? "right-3" : "left-3"}`} />
              <input
                value={query}
                onChange={e => setQuery(e.target.value)}
                placeholder={t("searchPlaceholder")}
                className={`w-full bg-brand-900 placeholder-brand-600 text-brand-50 rounded-xl py-2.5 text-sm outline-none focus:ring-2 focus:ring-brand-500 transition ${dir === "rtl" ? "pr-10 pl-4" : "pl-10 pr-4"}`}
              />
            </div>

            {/* Filters */}
            <div className="flex gap-1.5 mt-2.5 flex-wrap">
              <button
                onClick={() => { setEmergencyMode(true); setShowMap(false); }}
                className={`px-2.5 py-1 rounded-full text-xs font-bold transition ${emergencyMode ? "bg-rose-500 text-white shadow-md" : "bg-rose-950/70 text-rose-300"}`}
              >
                🚨 {t("emergency")}
              </button>
              {[
                { id: "all", label: t("filterAll") },
                { id: "open", label: t("filterOpen") },
                { id: "urgent", label: t("filterUrgent"), urgent: true },
                { id: "favorites", label: t("filterFavorites") },
                { id: "late", label: t("filterLate") },
              ].map(f => (
                <button
                  key={f.id}
                  onClick={() => { setFilter(f.id); setEmergencyMode(false); }}
                  className={`px-2.5 py-1 rounded-full text-xs font-medium transition ${
                    !emergencyMode && filter === f.id
                      ? f.urgent ? "bg-rose-500 text-white" : "bg-brand-400 text-brand-950"
                      : f.urgent ? "bg-rose-950/60 text-rose-300" : "bg-brand-900 text-brand-200"
                  }`}
                >
                  {f.label}
                </button>
              ))}
              <button
                onClick={() => { setShowMap(s => !s); setEmergencyMode(false); }}
                className={`px-2.5 py-1 rounded-full text-xs font-semibold transition flex items-center gap-1 ${showMap ? "bg-brand-400 text-brand-950" : "bg-brand-900 text-brand-200"}`}
              >
                <Icons.Map className="w-3 h-3" /> {showMap ? t("list") : t("map")}
              </button>
              <button
                onClick={() => setShowAddForm(true)}
                className="ms-auto px-2.5 py-1 rounded-full text-xs font-semibold bg-brand-400 text-brand-950 flex items-center gap-1"
              >
                <Icons.Plus className="w-3 h-3" /> {t("addPharmacyBtn")}
              </button>
            </div>

            {/* OSM load */}
            <div className="mt-2 flex gap-2 items-center flex-wrap">
              <button
                onClick={loadOSMNearMe}
                disabled={loadingOSM}
                className="px-3 py-1.5 rounded-full text-xs font-semibold bg-blue-900/80 text-blue-200 disabled:opacity-50 flex items-center gap-1.5 transition hover:bg-blue-800"
              >
                {loadingOSM ? (
                  <>
                    <span className="inline-block w-3 h-3 border-2 border-blue-300 border-t-transparent rounded-full animate-spin" />
                    {lang === "ar" ? "جاري الجلب..." : lang === "fr" ? "Chargement..." : "Loading..."}
                  </>
                ) : (
                  <>
                    <Icons.Globe className="w-3.5 h-3.5" />
                    {lang === "ar" ? "صيدليات قريبة (خريطة)" : lang === "fr" ? "Pharmacies proches" : "Nearby pharmacies"}
                  </>
                )}
              </button>
              {loadingOSM && (
                <span className="text-[10px] text-brand-400">
                  {lang === "ar" ? "قد يستغرق ثوانٍ..." : lang === "fr" ? "Quelques secondes..." : "A few seconds..."}
                </span>
              )}
            </div>

            {locating && (
              <div className="mt-2 flex items-center gap-2 text-xs text-brand-300">
                <span className="relative flex h-2 w-2">
                  <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-brand-400 opacity-75" />
                  <span className="relative inline-flex rounded-full h-2 w-2 bg-brand-500" />
                </span>
                {t("detecting")}
              </div>
            )}
            {geoError && !locating && (
              <div className="mt-2 text-xs text-rose-300 bg-rose-950/40 rounded-lg px-2.5 py-1.5">{t("geoError")}</div>
            )}
          </header>

          {toast && <Toast message={toast} onClose={() => setToast(null)} />}

          {/* Main */}
          <main className="px-4 py-4 space-y-3 max-w-lg mx-auto safe-bottom">
            {showMap ? (
              <div className="h-[60vh] rounded-2xl overflow-hidden border border-stone-200 dark:border-brand-800">

                      ))}
                    </div>
                  </>
                )}

                {adminTab === "all" && (
                  <>
                    <p className="text-sm text-brand-300 mb-4">{t("allPharmaciesSubtitle")}</p>
                    <div className="space-y-2">
                      {allComputed.map(ph => (
                        <div key={ph.id} className="bg-brand-900 rounded-xl p-3 border border-brand-800 flex items-center justify-between gap-2">
                          <div className="min-w-0">
                            <p className="text-sm font-medium text-brand-50 truncate">{ph.name}</p>
                            <p className="text-xs text-brand-400 truncate">{ph.area}</p>
                          </div>
                          <button onClick={() => removePermanently(ph.id, ph.name)} className="flex-shrink-0 bg-rose-950 text-rose-300 text-xs font-medium rounded-lg px-3 py-2">{t("deleteFinal")}</button>
                        </div>
                      ))}
                    </div>
                  </>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    // Error Boundary
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      render() {
        if (this.state.hasError) {
          return (
            <div style={{ padding: 24, fontFamily: "sans-serif", color: "#7f1d1d", background: "#fef2f2", direction: "rtl", textAlign: "right", minHeight: "100vh" }}>
              <h2 style={{ marginBottom: 12 }}>⚠️ حدث خطأ غير متوقع</h2>
              <p style={{ fontSize: 14, color: "#666", marginBottom: 16 }}>جرب تحديث الصفحة.</p>
              <button onClick={() => window.location.reload()} style={{ background: "#059669", color: "white", border: "none", padding: "10px 20px", borderRadius: 8, cursor: "pointer" }}>
                🔄 تحديث الصفحة
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById("root")).render(
      <ErrorBoundary>
        <PharisApp />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
