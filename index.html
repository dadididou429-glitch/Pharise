<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pharis Pro</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>html,body{margin:0;padding:0;}</style>
</head>
<body class="bg-stone-50">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const PHARMACIES = [
  { id: 1, name: "صيدلية بوعشة فريد", area: "سيدي بلعباس", address: "Rue 08 Novembre", phone: null, lat: 35.199, lng: -0.645, hours: { open: 8, close: 24 }, onDuty: false },
  { id: 2, name: "صيدلية أنس بن الأزهر", area: "سيدي جيلالي", address: "Agence Foncière", phone: "040 73 11 11", lat: 35.210, lng: -0.631, hours: { open: 0, close: 24 }, onDuty: true },
  { id: 3, name: "صيدلية منصور وفاء", area: "سيدي جيلالي", address: "250 Segar Abdelaziz", phone: null, lat: 35.216, lng: -0.635, hours: { open: 8.5, close: 24 }, onDuty: false },
  { id: 4, name: "صيدلية بن حمودة", area: "سيدي بلعباس", address: "Unnamed Rd", phone: "0557 48 64 80", lat: 35.219, lng: -0.626, hours: { open: 8, close: 25 }, onDuty: false },
  { id: 5, name: "صيدلية د. عربي", area: "روڨاب عكاشة", address: "Telmouni N°23", phone: "0542 61 77 50", lat: 35.174, lng: -0.545, hours: { open: 0, close: 24 }, onDuty: true },
];

function App() {
  const [now, setNow] = useState(new Date());
  const [filter, setFilter] = useState("all");
  
  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 30000);
    return () => clearInterval(t);
  }, []);

  const computeStatus = (ph) => {
    const hour = now.getHours() + now.getMinutes() / 60;
    if (ph.onDuty) return { open: true };
    const { open, close } = ph.hours;
    const isOpen = close > 24 ? hour >= open || hour < close - 24 : hour >= open && hour < close;
    return { open: isOpen };
  };

  const list = PHARMACIES.map(ph => ({ ...ph, status: computeStatus(ph) }))
    .filter(ph => filter === "open" ? ph.status.open : true);

  return (
    <div className="min-h-screen bg-stone-50">
      <header className="bg-emerald-950 text-white px-5 py-4">
        <h1 className="text-xl font-bold">Pharis Pro</h1>
        <p className="text-sm text-emerald-300">صيدليات سيدي بلعباس</p>
        <div className="flex gap-2 mt-3">
          <button onClick={() => setFilter("all")} className={`px-3 py-1 rounded-full text-xs ${filter === "all" ? "bg-emerald-500 text-emerald-950" : "bg-emerald-800"}`}>الكل</button>
          <button onClick={() => setFilter("open")} className={`px-3 py-1 rounded-full text-xs ${filter === "open" ? "bg-emerald-500 text-emerald-950" : "bg-emerald-800"}`}>المفتوحة</button>
        </div>
      </header>
      <main className="p-4 max-w-2xl mx-auto space-y-3">
        {list.map(ph => (
          <div key={ph.id} className="bg-white rounded-xl p-4 shadow-sm border border-stone-100">
            <div className="flex items-center gap-3">
              <div className={`w-3 h-3 rounded-full ${ph.status.open ? "bg-emerald-500" : "bg-rose-500"}`} />
              <div>
                <h3 className="font-bold text-stone-900">{ph.name}</h3>
                <p className="text-xs text-stone-500">{ph.area} — {ph.address}</p>
                <span className={`text-xs font-bold ${ph.status.open ? "text-emerald-600" : "text-rose-500"}`}>
                  {ph.status.open ? "مفتوحة الآن" : "مغلقة الآن"}
                </span>
              </div>
            </div>
          </div>
        ))}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
