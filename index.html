function tr(lang, key, vars = {}) {
  let str = T[lang][key] || T.ar[key] || key;
  Object.entries(vars).forEach(([k, v]) => { str = str.replace(`{${k}}`, v); });
  return str;
}

function useNow() {
  const [now, setNow] = useState(new Date());
  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 30000);
    return () => clearInterval(t);
  }, []);
  return now;
}

function computeStatus(ph, now) {
  const hour = now.getHours() + now.getMinutes() / 60;
  if (ph.onDuty) return { open: true, kind: "onDuty" };
  const { open, close } = ph.hours;
  const isOpen = close > 24 ? hour >= open || hour < close - 24 : hour >= open && hour < close;
  return { open: isOpen, kind: isOpen ? "closesAt" : "opensAt", time: isOpen ? close % 24 : open };
}

function fmtHour(h) {
  const hh = Math.floor(h) % 24;
  const mm = Math.round((h - Math.floor(h)) * 60);
  return String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0");
}

function haversine(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = ((lat2 - lat1) * Math.PI) / 180;
  const dLng = ((lng2 - lng1) * Math.PI) / 180;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos((lat1 * Math.PI) / 180) * Math.cos((lat2 * Math.PI) / 180) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

                {WILAYAS.map((w) => (
                  <button key={w.id} onClick={() => selectWilaya(w)} className={`text-right text-xs px-2.5 py-1.5 rounded-lg flex items-center justify-between gap-1 transition ${w.id === wilayaId ? "bg-emerald-500 text-emerald-950 font-medium" : w.enabled ? "text-emerald-200 hover:bg-emerald-900" : "text-emerald-600"}`}>
                    <span className="truncate">{w.name}</span>
                    {!w.enabled && <span className="text-[9px] flex-shrink-0 opacity-70">{t("comingSoon")}</span>}
                  </button>
                ))}
              </div>
            </div>
            <div className="pt-3 border-t border-emerald-800">
              <p className="text-xs text-emerald-300 px-1 pb-2">{t("communeLabel")}</p>
              <div className="grid grid-cols-2 gap-1">
                {communesForWilaya.map((c) => (
                  <button key={c.id} onClick={() => selectCommune(c)} className={`text-right text-xs px-2.5 py-1.5 rounded-lg flex items-center justify-between gap-1 transition ${c.id === communeId ? "bg-emerald-500 text-emerald-950 font-medium" : c.enabled ? "text-emerald-200 hover:bg-emerald-900" : "text-emerald-600"}`}>
                    <span className="truncate">{c.label || c.name}</span>
                    {!c.enabled && <span className="text-[9px] flex-shrink-0 opacity-70">{t("comingSoon")}</span>}
                  </button>
                ))}
              </div>
            </div>
          </div>
        )}

        <div className="mt-3 flex items-baseline gap-2">
          <span className="text-3xl font-bold mono text-emerald-400">{openCount}</span>
          <span className="text-xs text-emerald-200">{t("openStat", { total: list.length })}</span>
        </div>

        <div className="mt-3 relative">
          <Search className="absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-stone-500" />
          <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder={t("searchPlaceholder")} className="w-full bg-emerald-900 placeholder-stone-500 text-emerald-50 rounded-xl pr-10 pl-4 py-2 text-sm outline-none focus:ring-2 focus:ring-emerald-500 transition" />
        </div>

        <div className="flex gap-2 mt-2 flex-wrap">
          <button onClick={() => setFilter("all")} className={`px-3 py-1 rounded-full text-xs font-medium transition ${filter === "all" ? "bg-emerald-500 text-emerald-950" : "bg-emerald-900 text-emerald-200"}`}>{t("filterAll")}</button>
          <button onClick={() => setFilter("urgent")} className={`px-3 py-1 rounded-full text-xs font-bold transition ${filter === "urgent" ? "bg-rose-500 text-white" : "bg-rose-950 text-rose-300"}`}>{t("filterUrgent")}</button>
          <button onClick={() => setFilter("open")} className={`px-3 py-1 rounded-full text-xs font-medium transition ${filter === "open" ? "bg-emerald-500 text-emerald-950" : "bg-emerald-900 text-emerald-200"}`}>{t("filterOpen")}</button>
          <button onClick={() => setFilter("favorites")} className={`px-3 py-1 rounded-full text-xs font-medium transition flex items-center gap-1 ${filter === "favorites" ? "bg-emerald-500 text-emerald-950" : "bg-emerald-900 text-emerald-200"}`}><Heart className="w-3 h-3" fill={filter === "favorites" ? "currentColor" : "none"} />{t("filterFavorites")}</button>
          {reviewCount > 0 && (
            <button onClick={() => setShowReview((s) => !s)} className={`px-2.5 py-1 rounded-full text-xs font-medium transition flex items-center gap-1 ${showReview ? "bg-rose-500 text-white" : "bg-emerald-900 text-rose-300"}`}><AlertTriangle className="w-3 h-3" />{t("reviewBtn", { n: reviewCount })}</button>
          )}
          <button onClick={() => setShowAddForm(true)} className="mr-auto px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-400 text-emerald-950 flex items-center gap-1">+ {t("addPharmacyBtn")}</button>
        </div>
      </header>

      {toast && <div className="fixed top-4 left-1/2 -translate-x-1/2 z-40 bg-emerald-950 text-emerald-50 text-sm px-4 py-2.5 rounded-full shadow-lg max-w-[90%] text-center">{toast}</div>}

      <main className="px-5 py-5 space-y-3 max-w-md mx-auto">
        {list.length === 0 && <p className="text-center text-stone-500 mt-10">{filter === "favorites" ? t("noFavorites") : t("noResults")}</p>}
        {list.map((ph) => (
          <div key={ph.id} className={`w-full bg-white rounded-2xl p-4 shadow-sm border transition ${ph.underReview ? "border-rose-300 bg-rose-50" : "border-stone-200 hover:shadow-md"}`}>
            {ph.underReview && (
              <div className="flex items-center gap-1.5 text-xs font-medium text-rose-500 mb-2 bg-rose-50 rounded-lg px-2.5 py-1.5">
                <AlertTriangle className="w-3.5 h-3.5 flex-shrink-0" />{t("underReviewBanner", { n: ph.complaintCount })}
              </div>
            )}
            <div className="flex items-center gap-3">
              <button onClick={() => setSelected(ph)} className="flex-1 min-w-0 text-right flex items-center gap-3">
                <div className={`relative w-3 h-3 rounded-full pulse-dot flex-shrink-0 ${ph.status.open ? "text-emerald-500 bg-emerald-500" : "text-rose-500 bg-rose-500"}`} />
                <div className="flex-1 min-w-0">
                  <div className="flex items-center justify-between">
                    <h3 className="font-semibold text-stone-900 truncate flex items-center gap-1.5">
                      {ph.name}
                      {ph.verified === false && (<span className="text-[9px] font-medium bg-amber-100 text-amber-700 rounded-full px-1.5 py-0.5 flex-shrink-0">{t("unverifiedBadge")}</span>)}
                    </h3>
                    <span className="mono text-xs text-stone-500 flex-shrink-0 mr-2">{ph.distance.toFixed(1)} {lang === "ar" ? "كم" : "km"}</span>
                  </div>
                  <p className="text-xs text-stone-500 mt-0.5">{ph.area} · {ph.address}</p>
                  <div className="flex items-center justify-between mt-1">
                    <p className={`text-xs font-medium ${ph.status.open ? "text-emerald-700" : "text-rose-500"}`}>{ph.status.open ? t("openNow") : t("closedNow")} · {statusLabel(ph.status)}</p>
                    {ph.avgRating !== null && (<span className="flex items-center gap-0.5 text-xs text-amber-600 flex-shrink-0 mr-2"><Star className="w-3 h-3" fill="currentColor" />{ph.avgRating.toFixed(1)}</span>)}
                  </div>
                </div>
              </button>
              <div className="flex flex-col items-center gap-1 flex-shrink-0">
                <button onClick={() => toggleFavorite(ph.id, ph.name)} className={`p-2 rounded-full transition ${ph.isFavorite ? "text-rose-500" : "text-stone-400 hover:bg-rose-50 hover:text-rose-500"}`}><Heart className="w-4 h-4" fill={ph.isFavorite ? "currentColor" : "none"} /></button>
                <button onClick={() => reportPharmacy(ph.id, ph.name)} className="p-2 rounded-full text-stone-400 hover:bg-rose-50 hover:text-rose-500 transition"><Flag className="w-4 h-4" /></button>
              </div>
            </div>
          </div>
        ))}
      </main>

      {selected && (
        <div className="fixed inset-0 bg-black/40 flex items-end z-30" onClick={() => setSelected(null)}>
          <div className="bg-white w-full rounded-t-3xl p-6 max-w-md mx-auto sheet-anim" onClick={(e) => e.stopPropagation()}>
            <div className="flex justify-between items-start">
              <div>
                <h2 className="text-xl font-bold flex items-center gap-2">{selectedLive.name}{selectedLive.verified === false && (<span className="text-[10px] font-medium bg-amber-100 text-amber-700 rounded-full px-2 py-0.5">{t("unverifiedBadge")}</span>)}</h2>
                <p className="text-sm text-stone-500 mt-0.5">{selectedLive.area}</p>
                {selectedLive.verified === false && (<p className="text-xs text-amber-600 mt-1">{t("unverifiedNote")}</p>)}
              </div>
              <div className="flex items-center gap-1">
                <button onClick={() => toggleFavorite(selectedLive.id, selectedLive.name)} className={selectedLive.isFavorite ? "text-rose-500 p-1" : "text-stone-400 p-1"}><Heart className="w-5 h-5" fill={selectedLive.isFavorite ? "currentColor" : "none"} /></button>
                <button onClick={() => setSelected(null)} className="text-stone-500 p-1"><X className="w-5 h-5" /></button>
              </div>
            </div>
            <div className={`inline-flex items-center gap-1.5 mt-3 px-3 py-1 rounded-full text-sm font-medium ${selectedLive.status.open ? "bg-emerald-50 text-emerald-700" : "bg-rose-50 text-rose-500"}`}><span className={`w-2 h-2 rounded-full ${selectedLive.status.open ? "bg-emerald-500" : "bg-rose-500"}`} />{selectedLive.status.open ? t("openNow") : t("closedNowFull")}</div>
            <div className="mt-4 space-y-3 text-sm">
              <div className="flex items-center gap-2 text-stone-900"><MapPin className="w-4 h-4 text-stone-500" />{selectedLive.address}</div>
              <div className="flex items-center gap-2 text-stone-900 mono"><Navigation className="w-4 h-4 text-stone-500" />{selectedLive.distance.toFixed(1)} {lang === "ar" ? "كم عنك" : "km away"}</div>
              <div className="flex items-center gap-2 text-stone-900"><Clock className="w-4 h-4 text-stone-500" />{statusLabel(selectedLive.status)}</div>
              {selectedLive.phone && (<div className="flex items-center gap-2 text-stone-900 mono"><Phone className="w-4 h-4 text-stone-500" /><span dir="ltr">{selectedLive.phone}</span></div>)}
            </div>
            {selectedLive.underReview && (<div className="flex items-start gap-2 text-xs text-rose-500 mt-4 bg-rose-50 rounded-lg px-3 py-2.5"><AlertTriangle className="w-4 h-4 flex-shrink-0 mt-0.5" />{t("underReviewDetail", { n: selectedLive.complaintCount })}</div>)}
            <div className="mt-5 pt-4 border-t border-stone-200">
              <div className="flex items-center justify-between">
                <h3 className="text-sm font-semibold text-stone-900">{t("reviewsTitle")}</h3>
                {selectedLive.avgRating !== null ? (<span className="flex items-center gap-1 text-sm text-amber-600"><Star className="w-4 h-4" fill="currentColor" />{selectedLive.avgRating.toFixed(1)}<span className="text-stone-400 text-xs">{t("ratingsCount", { n: selectedLive.ratingCount })}</span></span>) : <span className="text-xs text-stone-400">{t("noRatingsYet")}</span>}
              </div>
              <p className="text-xs text-stone-500 mt-3 mb-1.5">{t("yourRating")}</p>
              <div className="flex items-center gap-1">{[1,2,3,4,5].map((n) => (<button key={n} onClick={() => setDraftStars(n)} className="p-0.5"><Star className={`w-6 h-6 ${n <= draftStars ? "text-amber-500" : "text-stone-200"}`} fill={n <= draftStars ? "currentColor" : "none"} /></button>))}</div>
              <textarea value={draftText} onChange={(e) => setDraftText(e.target.value)} placeholder={t("reviewPlaceholder")} rows={2} className="w-full mt-2 text-sm bg-stone-50 border border-stone-200 rounded-xl px-3 py-2 outline-none focus:ring-2 focus:ring-emerald-500 transition resize-none" />
              <button onClick={() => submitRating(selectedLive.id)} className="mt-2 w-full bg-emerald-700 text-emerald-50 rounded-xl py-2 text-sm font-medium">{t("submitReview")}</button>
            </div>
            <div className="flex gap-2 mt-5">
              <a href={`https://www.google.com/maps/dir/?api=1&destination=${selectedLive.lat},${selectedLive.lng}`} target="_blank" rel="noopener noreferrer" className="flex-1 bg-emerald-950 text-emerald-50 rounded-xl py-3 font-medium text-center">{t("directions")}</a>
              <button onClick={() => reportPharmacy(selectedLive.id, selectedLive.name)} className="px-4 rounded-xl border border-stone-200 text-rose-500 flex items-center justify-center"><Flag className="w-4 h-4" /></button>
            </div>
          </div>
        </div>
      )}

      {showAddForm && (
        <div className="fixed inset-0 bg-black/40 flex items-end z-30" onClick={() => !submitting && setShowAddForm(false)}>
          <div className="bg-white w-full rounded-t-3xl p-6 max-w-md mx-auto sheet-anim max-h-[90vh] overflow-y-auto" onClick={(e) => e.stopPropagation()}>
            <div className="flex justify-between items-start"><div><h2 className="text-xl font-bold">{t("addPharmacyTitle")}</h2><p className="text-sm text-stone-500 mt-0.5">{t("addPharmacySubtitle")}</p></div><button onClick={() => !submitting && setShowAddForm(false)} className="text-stone-500 p-1"><X className="w-5 h-5" /></button></div>
            <div className="mt-4 space-y-3">
              <div><label className="text-xs text-stone-500 mb-1 block">{t("formName")}</label><input value={formName} onChange={(e) => setFormName(e.target.value)} className="w-full bg-stone-50 border border-stone-200 rounded-xl px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-emerald-500" /></div>
              <div><label className="text-xs text-stone-500 mb-1 block">{t("communeLabel")}</label><select value={formCommune || ""} onChange={(e) => setFormCommune(e.target.value)} className="w-full bg-stone-50 border border-stone-200 rounded-xl px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-emerald-500">{(COMMUNES_BY_WILAYA[wilaya.name] || []).map((c) => (<option key={c.id} value={c.name}>{c.name}</option>))}</select></div>
              <div><label className="text-xs text-stone-500 mb-1 block">{t("formArea")}</label><input value={formArea} onChange={(e) => setFormArea(e.target.value)} className="w-full bg-stone-50 border border-stone-200 rounded-xl px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-emerald-500" /></div>
              <div><label className="text-xs text-stone-500 mb-1 block">{t("formAddress")}</label><input value={formAddress} onChange={(e) => setFormAddress(e.target.value)} className="w-full bg-stone-50 border border-stone-200 rounded-xl px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-emerald-500" /></div>
              <div><label className="text-xs text-stone-500 mb-1 block">{t("formPhone")}</label><input value={formPhone} onChange={(e) => setFormPhone(e.target.value)} dir="ltr" className="w-full bg-stone-50 border border-stone-200 rounded-xl px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-emerald-500" /></div>
              <label className="flex items-center gap-2 text-sm text-stone-700 py-1"><input type="checkbox" checked={formOnDuty} onChange={(e) => setFormOnDuty(e.target.checked)} className="w-4 h-4 accent-emerald-600" />{t("formOnDuty")}</label>
              {!formOnDuty && (<div className="grid grid-cols-2 gap-3"><div><label className="text-xs text-stone-500 mb-1 block">{t("formOpenHour")}</label><input type="number" min="0" max="24" step="0.5" value={formOpen} onChange={(e) => setFormOpen(e.target.value)} className="w-full bg-stone-50 border border-stone-200 rounded-xl px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-emerald-500" /></div><div><label className="text-xs text-stone-500 mb-1 block">{t("formCloseHour")}</label><input type="number" min="0" max="30" step="0.5" value={formClose} onChange={(e) => setFormClose(e.target.value)} className="w-full bg-stone-50 border border-stone-200 rounded-xl px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-emerald-500" /></div></div>)}
              <button onClick={captureFormLocation} type="button" className="w-full flex items-center justify-center gap-2 border border-stone-200 rounded-xl py-2.5 text-sm font-medium text-stone-700"><Navigation className="w-4 h-4" />{formLocStatus === "ok" ? t("locationCaptured") : t("useMyLocation")}</button>
              {formLocStatus === "failed" && <p className="text-xs text-rose-500">{t("locationFailed")}</p>}
              <button onClick={submitNewPharmacy} disabled={submitting} className="w-full bg-emerald-700 disabled:opacity-60 text-emerald-50 rounded-xl py-3 text-sm font-semibold mt-2">{submitting ? t("submittingPharmacy") : t("submitNewPharmacy")}</button>
            </div>
          </div>
        </div>
      )}

      {showLogin && (
        <div className="fixed inset-0 bg-black/40 flex items-end z-30" onClick={() => setShowLogin(false)}>
          <div className="bg-white w-full rounded-t-3xl p-6 max-w-md mx-auto sheet-anim" onClick={(e) => e.stopPropagation()}>
            <div className="flex justify-between items-start"><h2 className="text-xl font-bold">{t("adminLoginTitle")}</h2><button onClick={() => setShowLogin(false)} className="text-stone-500 p-1"><X className="w-5 h-5" /></button></div>
            <div className="mt-4 space-y-3">
              <input value={loginEmail} onChange={(e) => setLoginEmail(e.target.value)} dir="ltr" placeholder="admin@email.com" className="w-full bg-stone-50 border border-stone-200 rounded-xl px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-emerald-500" />
              <input value={loginPassword} onChange={(e) => setLoginPassword(e.target.value)} type="password" dir="ltr" placeholder="••••••••" onKeyDown={(e) => e.key === "Enter" && submitLogin()} className="w-full bg-stone-50 border border-stone-200 rounded-xl px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-emerald-500" />
              {loginError && <p className="text-xs text-rose-500">{loginError}</p>}
              <button onClick={submitLogin} disabled={loginLoading} className="w-full bg-emerald-700 disabled:opacity-60 text-emerald-50 rounded-xl py-3 text-sm font-semibold">{loginLoading ? "..." : t("loginBtn")}</button>
            </div>
          </div>
        </div>
      )}

      {adminView && (
        <div className="fixed inset-0 bg-emerald-950 z-40 overflow-y-auto">
          <div className="max-w-md mx-auto px-5 py-6">
            <div className="flex items-center justify-between mb-1"><h2 className="text-xl font-bold text-emerald-50">{t("adminTitle")}</h2><div className="flex items-center gap-2"><button onClick={logoutAdmin} className="text-xs text-rose-300 border border-rose-900 rounded-md px-2 py-1">{t("logoutBtn")}</button><button onClick={() => setAdminView(false)} className="text-emerald-400 p-1"><X className="w-5 h-5" /></button></div></div>
            <p className="text-xs text-emerald-500 mb-4 mono" dir="ltr">{adminUser && adminUser.email}</p>
            <div className="flex gap-2 mb-5">
              <button onClick={() => setAdminTab("review")} className={`flex-1 text-xs font-medium rounded-lg py-2 ${adminTab === "review" ? "bg-emerald-500 text-emerald-950" : "bg-emerald-900 text-emerald-300"}`}>{t("reviewBtn", { n: reviewQueue.length })}</button>
              <button onClick={() => setAdminTab("all")} className={`flex-1 text-xs font-medium rounded-lg py-2 ${adminTab === "all" ? "bg-emerald-500 text-emerald-950" : "bg-emerald-900 text-emerald-300"}`}>{t("allPharmaciesTab", { n: allComputed.length })}</button>
            </div>
            {adminTab === "review" && (
              <>
                <p className="text-sm text-emerald-300 mb-4">{t("adminSubtitle", { n: COMPLAINT_THRESHOLD })}</p>
                {reviewQueue.length === 0 && <div className="text-center text-emerald-600 mt-16 text-sm">{t("adminEmpty")}</div>}
                <div className="space-y-3">
                  {reviewQueue.map((ph) => (
                    <div key={ph.id} className="bg-emerald-950 rounded-2xl p-4 border border-emerald-800">
                      <div className="flex items-start justify-between"><div><h3 className="font-semibold text-emerald-50">{ph.name}</h3><p className="text-xs text-emerald-300 mt-0.5">{ph.area} · {ph.address}</p>{ph.phone && <p className="text-xs text-emerald-300 mt-0.5 mono" dir="ltr">{ph.phone}</p>}</div><div className="flex items-center gap-1 bg-rose-950 text-rose-300 text-xs font-semibold px-2.5 py-1 rounded-full flex-shrink-0"><AlertTriangle className="w-3 h-3" />{ph.complaintCount}</div></div>
                      <div className="flex gap-2 mt-4"><button onClick={() => dismissComplaints(ph.id, ph.name)} className="flex-1 bg-emerald-900 text-emerald-400 text-sm font-medium rounded-lg py-2.5">{t("verifyReturn")}</button><button onClick={() => removePermanently(ph.id, ph.name)} className="flex-1 bg-rose-950 text-rose-300 text-sm font-medium rounded-lg py-2.5">{t("deleteFinal")}</button></div>
                    </div>
                  ))}
                </div>
              </>
            )}
            {adminTab === "all" && (
              <>
                <p className="text-sm text-emerald-300 mb-4">{t("allPharmaciesSubtitle")}</p>
                <div className="space-y-2">
                  {allComputed.map((ph) => (
                    <div key={ph.id} className="bg-emerald-950 rounded-xl p-3 border border-emerald-800 flex items-center justify-between gap-2">
                      <div className="min-w-0"><p className="text-sm font-medium text-emerald-50 truncate flex items-center gap-1.5">{ph.name}{ph.verified === false && <span className="text-[9px] bg-amber-900 text-amber-300 rounded-full px-1.5 py-0.5 flex-shrink-0">{t("unverifiedBadge")}</span>}</p><p className="text-xs text-emerald-400 truncate">{ph.area}</p></div>
                      <button onClick={() => removePermanently(ph.id, ph.name)} className="flex-shrink-0 bg-rose-950 text-rose-300 text-xs font-medium rounded-lg px-3 py-2">{t("deleteFinal")}</button>
                    </div>
                  ))}
                </div>
              </>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<PharmacyFinder />);
document.getElementById("root").dataset.mounted = "true";
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
