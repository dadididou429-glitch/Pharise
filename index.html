<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharis - Find Your Pharmacy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Splash Screen -->
<div class="pharis-splash" id="splash">
    <div class="capsule-glow"></div>

    <div class="capsule-3d-wrap">
        <div class="capsule-3d" id="capsule3d">
            <svg class="capsule-svg" viewBox="0 0 140 220" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#f8f8f8"/>
                        <stop offset="50%" style="stop-color:#ffffff"/>
                        <stop offset="100%" style="stop-color:#e8e8e8"/>
                    </linearGradient>
                    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#dc2626"/>
                        <stop offset="50%" style="stop-color:#ef4444"/>
                        <stop offset="100%" style="stop-color:#b91c1c"/>
                    </linearGradient>
                    <filter id="glow">
                        <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                        <feMerge>
                            <feMergeNode in="coloredBlur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>

                <!-- White half (top) -->
                <path d="M20 70 Q20 20 70 20 Q120 20 120 70 L120 110 L20 110 Z" fill="url(#capGrad)" stroke="#ddd" stroke-width="1"/>

                <!-- Red half (bottom) -->
                <path d="M20 110 L120 110 L120 150 Q120 200 70 200 Q20 200 20 150 Z" fill="url(#redGrad)"/>

                <!-- Cross / Plus sign (white on red) -->
                <g transform="translate(70, 155)" filter="url(#glow)">
                    <rect x="-12" y="-4" width="24" height="8" rx="2" fill="#fff"/>
                    <rect x="-4" y="-12" width="8" height="24" rx="2" fill="#fff"/>
                </g>

                <!-- Green location pin (on white half) -->
                <g transform="translate(70, 65)" filter="url(#glow)">
                    <path d="M0 -18 C-10 -18 -16 -10 -16 0 C-16 12 0 26 0 26 C0 26 16 12 16 0 C16 -10 10 -18 0 -18 Z" fill="#22c55e"/>
                    <circle cx="0" cy="-2" r="6" fill="#fff"/>
                </g>

                <!-- 3D shine effect -->
                <ellipse cx="50" cy="65" rx="15" ry="25" fill="rgba(255,255,255,0.3)" transform="rotate(-15 50 65)"/>
                <ellipse cx="50" cy="155" rx="12" ry="20" fill="rgba(255,255,255,0.15)" transform="rotate(-15 50 155)"/>
            </svg>
        </div>
    </div>

    <div class="pharis-name" id="pharisName">
        <span class="letter" style="--scatter-x:-120px;--scatter-y:-80px;--scatter-r:-45deg;">P</span>
        <span class="letter" style="--scatter-x:100px;--scatter-y:-100px;--scatter-r:30deg;">h</span>
        <span class="letter" style="--scatter-x:-80px;--scatter-y:60px;--scatter-r:-60deg;">a</span>
        <span class="letter" style="--scatter-x:90px;--scatter-y:80px;--scatter-r:45deg;">r</span>
        <span class="letter" style="--scatter-x:-100px;--scatter-y:-40px;--scatter-r:-30deg;">i</span>
        <span class="letter" style="--scatter-x:70px;--scatter-y:50px;--scatter-r:60deg;">s</span>
    </div>

    <div class="pharis-subtitle">Find Your Pharmacy</div>

    <div class="loading-bar">
        <div class="loading-bar-fill"></div>
    </div>
</div>

<!-- Welcome Screen -->
<div class="welcome-screen" id="welcome">
    <div class="welcome-content">
        <div class="welcome-icon">💊</div>
        <div class="welcome-title">Welcome to Pharis</div>
        <div class="welcome-text">Find open pharmacies near you instantly. We use your location to show the nearest options.</div>
        <button class="detect-btn" id="detectBtn">📍 Detect My Location</button>
    </div>
</div>

<!-- Geo Status -->
<div class="geo-status" id="geoStatus">
    <div class="geo-spinner"></div>
    <span id="geoText">Detecting location...</span>
</div>

<script src="script.js"></script>
</body>
</html>
