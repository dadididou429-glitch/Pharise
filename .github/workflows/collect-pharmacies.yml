name: Collect Algeria Pharmacies

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect AnnuMed
        run: python scrape_annumed.py

      - name: Convert candidates
        run: |
          if [ -f annumed_raw.csv ]; then
            python convert_to_pharis.py || true
          fi

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: annumed-pharmacies
          path: |
            annumed_raw.csv
            pharis_annumed_candidates.json
          if-no-files-found: warn
