  <script>
    (function () {
      var boot = document.getElementById("pharis-boot");
      var hidden = false;
      var NAME_DONE_MS = 1400;
      var HOLD_NAME_MS = 400;
      var FADE_MS = 300;
      var audioCtx = null;

      function music() {
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === "suspended") audioCtx.resume();
          var t0 = audioCtx.currentTime + 0.02;
          var master = audioCtx.createGain();
          master.gain.setValueAtTime(0.0001, t0);
          master.gain.exponentialRampToValueAtTime(0.08, t0 + 0.15);
          master.gain.setValueAtTime(0.08, t0 + 1.4);
          master.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.85);
          master.connect(audioCtx.destination);
          function pad(f, s, d) {
            var o = audioCtx.createOscillator();
            var g = audioCtx.createGain();
            o.type = "sine"; o.frequency.value = f;
            g.gain.setValueAtTime(0.0001, t0 + s);
            g.gain.exponentialRampToValueAtTime(0.03, t0 + s + 0.1);
            g.gain.exponentialRampToValueAtTime(0.0001, t0 + s + d);
            o.connect(g); g.connect(master);
            o.start(t0 + s); o.stop(t0 + s + d);
          }
          function note(f, s, d, v) {
            var o = audioCtx.createOscillator();
            var g = audioCtx.createGain();
            o.type = "triangle"; o.frequency.value = f;
            g.gain.setValueAtTime(0.0001, t0 + s);
            g.gain.exponentialRampToValueAtTime(v || 0.05, t0 + s + 0.015);
            g.gain.exponentialRampToValueAtTime(0.0001, t0 + s + d);
            o.connect(g); g.connect(master);
            o.start(t0 + s); o.stop(t0 + s + d);
          }
          pad(261.63, 0, 1.8); pad(329.63, 0.08, 1.7); pad(392, 0.15, 1.6);
          note(392, 0.15, 0.2); note(523.25, 0.45, 0.25); note(659.25, 0.75, 0.25);
          note(523.25, 1.05, 0.2); note(783.99, 1.3, 0.35, 0.06);
        } catch (e) {}
      }
      music();

      function hideBoot() {
        if (hidden || !boot) return;
        hidden = true;
        boot.style.transition = "opacity " + (FADE_MS / 1000) + "s ease";
        boot.style.opacity = "0";
        try { if (audioCtx) setTimeout(function () { try { audioCtx.close(); } catch (e) {} }, 150); } catch (e) {}
        setTimeout(function () {
          if (boot && boot.parentNode) boot.parentNode.removeChild(boot);
        }, FADE_MS + 20);
      }

      if (boot) {
        boot.addEventListener("click", hideBoot, { once: true });
        boot.addEventListener("pointerdown", function once() {
          try { if (audioCtx && audioCtx.state === "suspended") audioCtx.resume(); music(); } catch (e) {}
        }, { once: true });
      }

      window.__pharisHideBoot = hideBoot;
      setTimeout(hideBoot, NAME_DONE_MS + HOLD_NAME_MS);
    })();
  </script>

    function normalizeSearch(s) {
      return String(s || "")
        .toLowerCase()
        .normalize("NFKD")
        .replace(/[\u064B-\u065F\u0670]/g, "")
        .replace(/\u0640/g, "")
        .replace(/[أإآٱ]/g, "ا")
        .replace(/[ىئ]/g, "ي")
        .replace(/ة/g, "ه")
        .replace(/[^\p{L}\p{N}\s]/gu, " ")
        .replace(/\s+/g, " ")
        .trim();
    }
    function matchesSearch(ph, qRaw) {
      const q = normalizeSearch(qRaw);
      if (!q) return true;
      const hay = normalizeSearch([ph.name, ph.area, ph.address, ph.wilaya, ph.commune, ph.phone].filter(Boolean).join(" "));
      return q.split(" ").every(w => w && hay.includes(w));
    }

    function useNow() {
      const [now, setNow] = useState(() => new Date());
      useEffect(() => {
        const t = setInterval(() => setNow(new Date()), 30000);
        return () => clearInterval(t);
      }, []);
      return now;
    }

    function computeStatus(ph, now) {
      if (ph.onDuty) return { open: true, kind: "onDuty" };
      const hour = now.getHours() + now.getMinutes() / 60;
      const { open, close } = ph.hours || { open: 8, close: 21 };
      const isOpen = close > 24 ? (hour >= open || hour < close - 24) : (hour >= open && hour < close);
      return { open: isOpen, kind: isOpen ? "closesAt" : "opensAt", time: isOpen ? close % 24 : open };
    }

    function fmtHour(h) {
      const hh = Math.floor(h) % 24;
      const mm = Math.round((h - Math.floor(h)) * 60);
      return String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0");
    }

    function haversine(lat1, lng1, lat2, lng2) {
      const R = 6371;
      const dLat = ((lat2 - lat1) * Math.PI) / 180;
      const dLng = ((lng2 - lng1) * Math.PI) / 180;
      const a = Math.sin(dLat / 2) ** 2 + Math.cos((lat1 * Math.PI) / 180) * Math.cos((lat2 * Math.PI) / 180) * Math.sin(dLng / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function sanitize(text, max = 100) {
      if (!text || typeof text !== "string") return null;
      const cleaned = text.trim().replace(/[<>\x00-\x1F\x7F]/g, "").substring(0, max);
      return cleaned.length > 0 ? cleaned : null;
    }

      }, [value, delay]);
      return debounced;
    }
